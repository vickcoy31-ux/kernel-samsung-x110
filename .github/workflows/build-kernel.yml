name: GTA9 X110 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            pahole \
            rsync \
            unzip \
            zip \
            lz4 \
            zstd \
            cpio \
            device-tree-compiler \
            perl \
            python3-setuptools

      - name: Clone GTA9 Source
        run: |
          set -eux

          rm -rf gta9

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "========================================"
          echo "SOURCE COMMIT"
          echo "========================================"

          git rev-parse HEAD

          echo "========================================"
          echo "SOURCE VERSION"
          echo "========================================"

          make kernelversion

      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "========================================"
          echo "KERNELSU COMMIT"
          echo "========================================"

          git -C KernelSU rev-parse HEAD

          test -d KernelSU/kernel

      - name: Prepare Source Layout
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "ORIGINAL SOURCE LAYOUT"
          echo "========================================"

          ls -lah

          echo "========================================"
          echo "CREATE COMPATIBILITY LINKS"
          echo "========================================"

          # The vendor build scripts expect the kernel tree
          # to exist as ./kernel-5.10.
          if [ ! -e kernel-5.10 ]; then
            ln -s . kernel-5.10
          fi

          # The vendor build scripts expect ./kernel/build/build.sh.
          # The actual Android build system is under setup/kernel/build.
          if [ ! -e build ]; then
            ln -s setup/kernel/build build
          fi

          echo "========================================"
          echo "CHECK LINKS"
          echo "========================================"

          ls -ld kernel-5.10
          ls -ld build

          echo "========================================"
          echo "BUILD SCRIPT"
          echo "========================================"

          test -f kernel-5.10/Makefile
          test -f build/build.sh

          ls -lh build/build.sh

      - name: Download Android Clang r416183b
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "DOWNLOAD CLANG R416183B"
          echo "========================================"

          mkdir -p prebuilts-master/clang/host/linux-x86

          cd prebuilts-master/clang/host/linux-x86

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz" \
            -o clang-r416183b.tar.gz

          mkdir -p clang-r416183b

          tar \
            -xzf clang-r416183b.tar.gz \
            -C clang-r416183b

          rm -f clang-r416183b.tar.gz

          echo "========================================"
          echo "CLANG CONTENT"
          echo "========================================"

          ls -lah clang-r416183b

          test -x clang-r416183b/bin/clang
          test -x clang-r416183b/bin/ld.lld

          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          clang-r416183b/bin/clang --version

      - name: Convert MTK Config Generator To Python 3
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "CHECK PYTHON GENERATOR"
          echo "========================================"

          grep -n "print '" scripts/gen_build_config.py || true

          echo "========================================"
          echo "CONVERT PYTHON 2 -> PYTHON 3"
          echo "========================================"

          cp \
            scripts/gen_build_config.py \
            scripts/gen_build_config.py.orig

          2to3 \
            -w \
            scripts/gen_build_config.py

          echo "========================================"
          echo "PYTHON SYNTAX CHECK"
          echo "========================================"

          python3 -m py_compile scripts/gen_build_config.py

      - name: Generate Build Config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          cd kernel-5.10

          echo "========================================"
          echo "GENERATE BUILD CONFIG"
          echo "========================================"

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o ../out/build.config

          echo "========================================"
          echo "GENERATED BUILD CONFIG"
          echo "========================================"

          cat ../out/build.config

      - name: Patch Generated Toolchain Path
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "TOOLCHAIN PATH"
          echo "========================================"

          grep -n \
            "CLANG_PREBUILT_BIN\|KERNEL_DIR\|CROSS_COMPILE\|MAKE_GOALS" \
            out/build.config \
            || true

          echo "========================================"
          echo "VERIFY CLANG"
          echo "========================================"

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/ld.lld

      - name: Build Kernel
        working-directory: gta9
        run: |
          set -eux

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export OUT_DIR=../gta9/out
          export DIST_DIR=../gta9/out

          export BUILD_CONFIG=../gta9/out/build.config

          export CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r416183b/bin

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
          echo "BUILD_CONFIG=$BUILD_CONFIG"
          echo "CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          "$CLANG_PREBUILT_BIN/clang" --version

          echo "========================================"
          echo "BUILD.SH"
          echo "========================================"

          test -x build/build.sh

          echo "========================================"
          echo "START KERNEL BUILD"
          echo "========================================"

          ./build/build.sh \
            LLVM_IAS=1 \
            -j"$(nproc)"

      - name: Inspect Build Output
        if: always()
        working-directory: gta9
        run: |
          echo "========================================"
          echo "OUTPUT TREE"
          echo "========================================"

          find out \
            -maxdepth 7 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "vmlinux" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "*.ko" \
            \) \
            -print 2>/dev/null || true

          echo "========================================"
          echo "DIST TREE"
          echo "========================================"

          find out \
            -maxdepth 6 \
            -type f \
            -path "*/dist/*" \
            -print 2>/dev/null || true

      - name: Prepare GTA9 Artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "PREPARE ARTIFACTS"
          echo "========================================"

          mkdir -p artifact

          # Kernel image
          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              artifact/Image.gz
          fi

          # DTBs
          if [ -d out/kernel-5.10/arch/arm64/boot/dts ]; then
            find \
              out/kernel-5.10/arch/arm64/boot/dts \
              -type f \
              -name "*.dtb" \
              -exec cp {} artifact/ \;
          fi

          # DTBO
          if [ -d out/kernel-5.10/arch/arm64/boot/dts ]; then
            find \
              out/kernel-5.10/arch/arm64/boot/dts \
              -type f \
              -name "*.dtbo" \
              -exec cp {} artifact/ \;
          fi

          # All distribution files
          if [ -d out/dist ]; then
            cp -r out/dist artifact/dist
          fi

          echo "========================================"
          echo "ARTIFACT CONTENT"
          echo "========================================"

          find artifact -type f -print

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: |
            gta9/artifact/**
            gta9/out/build.config
            gta9/out/build.config.mtk
            gta9/out/build.config.gki.aarch64
          if-no-files-found: warn
