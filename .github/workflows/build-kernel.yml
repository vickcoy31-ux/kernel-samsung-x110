name: Build Kernel - Samsung X110

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            wget \
            curl \
            ccache \
            rsync \
            kmod \
            cpio \
            python3 \
            lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Check Kernel Source
        run: |
          cd kernel-5.10
          echo "=== Kernel version ==="
          head -n 8 Makefile
          echo "=== GTA9 configs ==="
          ls -lh arch/arm64/configs/*gta9* || true

      - name: Inject KernelSU
        run: |
          cd kernel-5.10
          rm -rf drivers/kernelsu
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile

          git clone --depth=1 url?id=1tiann/KernelSU.git /tmp/KernelSU
          ln -s /tmp/KernelSU/kernel drivers/kernelsu

          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: Prepare Defconfig
        run: |
          cd kernel-5.10
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make gta9_00_defconfig
          ./scripts/config --enable CONFIG_KSU

      - name: Build Kernel
        run: |
          cd kernel-5.10
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          make -j"$(nproc)" CC=clang LLVM=1 LLVM_IAS=1 Image.gz dtbs

      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-x110-kernel-kernelsu
          path: |
            kernel-5.10/arch/arm64/boot/Image
            kernel-5.10/arch/arm64/boot/Image.gz
            kernel-5.10/arch/arm64/boot/dts/**/*.dtb
            kernel-5.10/arch/arm64/boot/dts/**/*.dtbo
