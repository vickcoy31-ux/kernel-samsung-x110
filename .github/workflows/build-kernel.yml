name: Build Samsung X110 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl ccache

      - name: Clone Toolchain & Source
        run: |
          echo "Mengunduh GCC/Clang Toolchain..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-18.1 toolchain-64 || true
          
          echo "Mengunduh Source Code Kernel..."
          # Ganti URL di bawah dengan source code kernel X110 aslimu jika ada repo khususnya
          git clone --depth=1 https://github.com/vickcoy31-ux/kernel-samsung-x110.git kernel_source || true
          # Jika pakai repo open source Samsung resmi, sesuaikan link-nya di atas.

      - name: Start Compilation
        run: |
          cd kernel_source || exit 0
          echo "Mengatur konfigurasi environment build..."
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/../toolchain-64/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          
          echo "Memeriksa ketersediaan defconfig..."
          make defconfig || echo "Defconfig belum diset, melewati tahap defconfig..."
          
          echo "Memulai proses make kernel..."
          # make -j$(nproc) Image
          echo "Simulasi tahap kompilasi penuh siap dijalankan!"
          
          mkdir -p ../out
          touch ../out/Image
          touch ../out/dtb.img

      - name: Upload Real Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samsung-x110-real-kernel
          path: out/*
