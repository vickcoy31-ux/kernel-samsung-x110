name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            clang-12 \
            flex \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            device-tree-compiler

      # ============================================================
      # 2. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone Kernel Source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "========================================"
          echo "KERNEL SOURCE"
          echo "========================================"

          pwd
          git rev-parse --short HEAD

          echo "========================================"
          echo "SOURCE ROOT"
          echo "========================================"

          ls -la

      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "========================================"
          echo "KERNELSU"
          echo "========================================"

          git -C KernelSU rev-parse HEAD

          ls -la KernelSU

          echo "========================================"
          echo "KSU CONFIG"
          echo "========================================"

          grep -R "CONFIG_KSU" -n kernel/configs || true

      # ============================================================
      # 4. PREPARE COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare Build Layout
        working-directory: gta9
        run: |
          set -eux

          ln -s . kernel-5.10
          ln -s setup/kernel/build build

          echo "========================================"
          echo "KERNEL LINK"
          echo "========================================"

          ls -ld kernel-5.10

          echo "========================================"
          echo "BUILD LINK"
          echo "========================================"

          ls -ld build

          echo "========================================"
          echo "BUILD SCRIPT"
          echo "========================================"

          test -f build/build.sh
          ls -lh build/build.sh

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang
        working-directory: gta9
        run: |
          set -eux

          mkdir -p \
            prebuilts-master/clang/host/linux-x86/clang-r416183b

          wget -q --show-progress \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz \
            -O /tmp/clang-r416183b.tar.gz

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C prebuilts-master/clang/host/linux-x86/clang-r416183b

          echo "========================================"
          echo "CLANG CHECK"
          echo "========================================"

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang

          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang \
            --version

      # ============================================================
      # 6. CONVERT PYTHON 2 BUILD CONFIG GENERATOR
      # ============================================================
      - name: Convert Build Config Generator
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "GENERATOR BEFORE CONVERSION"
          echo "========================================"

          head -40 scripts/gen_build_config.py

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          echo "========================================"
          echo "GENERATOR AFTER CONVERSION"
          echo "========================================"

          head -40 scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

      # ============================================================
      # 7. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate Build Config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          cd kernel-5.10

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          cd ..

          echo "========================================"
          echo "GENERATED BUILD CONFIG"
          echo "========================================"

          test -f out/build.config

          cat out/build.config

      # ============================================================
      # 8. PATCH TOOLCHAIN PATH
      # ============================================================
      - name: Patch Generated Toolchain Path
        working-directory: gta9
        run: |
          set -eux

          test -f out/build.config

          CLANG_PATH="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "========================================"
          echo "BUILD CONFIG BEFORE PATCH"
          echo "========================================"

          grep -n \
            "KERNEL_DIR\|KERNEL_DEFCONFIG_FILE\|BUILD_CONFIG_FRAGMENTS\|CLANG_PREBUILT_BIN" \
            out/build.config || true

          if grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then

            sed -i \
              "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_PATH}#" \
              out/build.config

          else

            echo "CLANG_PREBUILT_BIN=${CLANG_PATH}" \
              >> out/build.config

          fi

          echo "========================================"
          echo "FINAL BUILD CONFIG"
          echo "========================================"

          cat out/build.config

      # ============================================================
      # 9. VERIFY SOURCE AND BUILD ENVIRONMENT
      # ============================================================
      - name: Verify Build Environment
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"

          pwd

          echo "========================================"
          echo "BUILD CONFIG"
          echo "========================================"

          test -f out/build.config
          ls -lh out/build.config

          echo "========================================"
          echo "BUILD SCRIPT"
          echo "========================================"

          test -f build/build.sh
          ls -lh build/build.sh

          echo "========================================"
          echo "KERNEL TREE"
          echo "========================================"

          test -f Makefile
          test -d arch
          test -d drivers
          test -d scripts

          echo "========================================"
          echo "DEFCONFIG"
          echo "========================================"

          test -f \
            arch/arm64/configs/gta9_00_defconfig

          echo "========================================"
          echo "DEVICE TREE"
          echo "========================================"

          test -f \
            arch/arm64/boot/dts/samsung/mt8781_gta9wifi_eur_open_00.dts

          echo "========================================"
          echo "KERNELSU"
          echo "========================================"

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang \
            --version

          echo "========================================"
          echo "CROSS COMPILER"
          echo "========================================"

          aarch64-linux-gnu-gcc --version | head -1

          echo "========================================"
          echo "MAKE"
          echo "========================================"

          make --version | head -1

          echo "========================================"
          echo "DTC"
          echo "========================================"

          dtc --version

      # ============================================================
      # 10. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        working-directory: gta9
        run: |
          set -eux

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export OUT_DIR="${GITHUB_WORKSPACE}/gta9/out"
          export DIST_DIR="${GITHUB_WORKSPACE}/gta9/out"

          export BUILD_CONFIG="out/build.config"

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "PREPARING BUILD COMMAND PATH"
          echo "========================================"

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          mkdir -p "${BUILD_TOOLS_DIR}"

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # build.sh replaces PATH internally with its own
          # build-tools/path/linux-x86 directory.
          #
          # Therefore the normal /usr/bin and /bin commands need
          # to be exposed inside that directory.
          # --------------------------------------------------------

          for cmd in \
            nproc \
            readlink \
            rm \
            mkdir \
            cp \
            mv \
            ln \
            make \
            gcc \
            g++ \
            ld \
            ld.bfd \
            ld.gold \
            ar \
            as \
            objcopy \
            objdump \
            strip \
            ranlib \
            nm \
            addr2line \
            strings \
            c++filt \
            cat \
            chmod \
            chown \
            dirname \
            basename \
            grep \
            egrep \
            fgrep \
            sed \
            awk \
            find \
            sort \
            uniq \
            cut \
            tr \
            head \
            tail \
            touch \
            stat \
            printf \
            pwd \
            realpath \
            which \
            env \
            tee \
            xargs \
            expr \
            date \
            sleep \
            diff \
            cmp \
            du \
            df \
            tar \
            gzip \
            gunzip \
            bzip2 \
            xz \
            unzip \
            zip \
            rsync \
            git \
            perl \
            python3 \
            python \
            bc \
            flex \
            bison \
            dtc \
            file
          do
            if [ -x "/usr/bin/${cmd}" ]; then

              ln -sf \
                "/usr/bin/${cmd}" \
                "${BUILD_TOOLS_DIR}/${cmd}"

            elif [ -x "/bin/${cmd}" ]; then

              ln -sf \
                "/bin/${cmd}" \
                "${BUILD_TOOLS_DIR}/${cmd}"

            else

              echo "WARNING: ${cmd} not found"

            fi
          done

          echo "========================================"
          echo "BUILD COMMANDS"
          echo "========================================"

          ls -la "${BUILD_TOOLS_DIR}"

          echo "========================================"
          echo "IMPORTANT TOOL CHECK"
          echo "========================================"

          test -x "${BUILD_TOOLS_DIR}/make"
          test -x "${BUILD_TOOLS_DIR}/mkdir"
          test -x "${BUILD_TOOLS_DIR}/rm"
          test -x "${BUILD_TOOLS_DIR}/cp"
          test -x "${BUILD_TOOLS_DIR}/nproc"

          echo "make:"
          "${BUILD_TOOLS_DIR}/make" --version | head -1

          echo "nproc:"
          "${BUILD_TOOLS_DIR}/nproc"

          echo "========================================"
          echo "BUILD VARIABLES"
          echo "========================================"

          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}"
          echo "LLVM=${LLVM}"
          echo "LLVM_IAS=${LLVM_IAS}"

          echo "========================================"
          echo "BUILD CONFIG CHECK"
          echo "========================================"

          test -f "${BUILD_CONFIG}"

          grep -n \
            "KERNEL_DIR\|KERNEL_DEFCONFIG_FILE\|BUILD_CONFIG_FRAGMENTS\|CLANG_PREBUILT_BIN" \
            "${BUILD_CONFIG}"

          echo "========================================"
          echo "RUNNING build/build.sh"
          echo "========================================"

          ./build/build.sh \
            LLVM_IAS=1 \
            -j"$(nproc)"

      # ============================================================
      # 11. INSPECT BUILD OUTPUT
      # ============================================================
      - name: Inspect Build Output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "OUT DIRECTORY"
          echo "========================================"

          find out \
            -maxdepth 6 \
            -type f \
            -printf '%p %k KB\n' \
            2>/dev/null \
            | sort || true

          echo "========================================"
          echo "KERNEL IMAGES"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo "========================================"
          echo "VMLINUX"
          echo "========================================"

          find . \
            -type f \
            -name "vmlinux" \
            -print \
            2>/dev/null \
            | sort || true

      # ============================================================
      # 12. PREPARE ARTIFACTS
      # ============================================================
      - name: Prepare Artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          echo "========================================"
          echo "SEARCHING KERNEL OUTPUT"
          echo "========================================"

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print

          echo "========================================"
          echo "COPYING KERNEL IMAGE"
          echo "========================================"

          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              release/Image.gz

          elif [ -f out/kernel-5.10/arch/arm64/boot/Image ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/Image \
              release/Image

          fi

          echo "========================================"
          echo "COPYING DTB"
          echo "========================================"

          if [ -f out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt6789.dtb ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt6789.dtb \
              release/mt6789.dtb

          fi

          echo "========================================"
          echo "COPYING DTBO"
          echo "========================================"

          if [ -f out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtbo ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtbo \
              release/mt8781_gta9_eur_open_00.dtbo

          fi

          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          ls -lah release

          test "$(find release -type f | wc -l)" -gt 0

      # ============================================================
      # 13. UPLOAD KERNEL
      # ============================================================
      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-a9-x110-kernel
          path: gta9/release/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 14. UPLOAD FULL BUILD OUTPUT
      # ============================================================
      - name: Upload Build Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-a9-x110-build-output
          path: gta9/out/
          if-no-files-found: warn
          retention-days: 7
