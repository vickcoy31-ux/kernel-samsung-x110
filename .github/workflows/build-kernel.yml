name: Build Samsung X110 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git

      - name: Clone Kernel Source
        run: |
          echo "Mendownload source code kernel Samsung X110..."
          # Nanti link source code Samsung-nya dimasukin sini
          git clone --depth=1 https://github.com/vickcoy31-ux/kernel-samsung-x110.git source_test
          echo "Source berhasil diunduh!"
