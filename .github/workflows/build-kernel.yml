name: Build Samsung X110 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git

      - name: Check Environment Ready
        run: |
          echo "Server build kernel siap!"
          echo "Jumlah CPU core:"
          nproc
          echo "Kapasitas RAM:"
          free -h
