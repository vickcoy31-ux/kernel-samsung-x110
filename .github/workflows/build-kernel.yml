name: Build Kernel Samsung X110

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl ccache rsync kmod cpio python3 lz4

      - name: Locate Kernel Root Directory
        id: locate
        run: |
          # Cari lokasi Makefile utama kernel
          MAKEFILE_PATH=$(find . -maxdepth 3 -name "Makefile" -exec grep -l "VERSION =" {} + | head -n 1)
          if [ -n "$MAKEFILE_PATH" ]; then
            KERNEL_DIR=$(dirname "$MAKEFILE_PATH")
            echo "Kernel root ditemukan di: $KERNEL_DIR"
            echo "kernel_dir=$KERNEL_DIR" >> $GITHUB_OUTPUT
          else
            echo "Kernel root tidak ditemukan, menggunakan folder utama."
            echo "kernel_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 url?id=1kdrag0n/proton-clang.git clang

      - name: Inject KernelSU Clean Setup
        run: |
          cd ${{ steps.locate.outputs.kernel_dir }}
          rm -rf drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: Start Full Compilation
        run: |
          # Pindah ke folder kernel hasil pencarian
          cd ${{ steps.locate.outputs.kernel_dir }}
          
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/../clang/bin:$(pwd)/clang/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          CONFIG_PATH=$(find arch/arm64/configs/ -type f \( -iname "*x110*" -o -iname "*gta9*" \) | head -n 1)

          if [ -n "$CONFIG_PATH" ]; then
            TARGET_CONFIG=$(echo "$CONFIG_PATH" | sed 's|arch/arm64/configs/||')
            make CC=clang $TARGET_CONFIG
          else
            make CC=clang defconfig
          fi

          chmod +x scripts/config || true
          scripts/config --enable CONFIG_KSU || echo "CONFIG_KSU=y" >> .config
          make -j$(nproc) CC=clang Image

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samsung-x110-kernel
          path: ${{ steps.locate.outputs.kernel_dir }}/arch/arm64/boot/Image
