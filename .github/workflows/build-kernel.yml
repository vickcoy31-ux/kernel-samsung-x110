name: GTA9 X110 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-lib2to3 \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            pahole \
            rsync \
            unzip \
            zip \
            lz4 \
            zstd \
            cpio \
            device-tree-compiler \
            perl \
            python3-setuptools

          echo "========================================"
          echo "DEPENDENCIES INSTALLED"
          echo "========================================"

          python3 --version
          command -v 2to3
          git --version


      # ============================================================
      # 2. CLONE GTA9 SOURCE
      # ============================================================
      - name: Clone GTA9 Source
        run: |
          set -eux

          rm -rf gta9

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "========================================"
          echo "SOURCE COMMIT"
          echo "========================================"

          git rev-parse HEAD

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          make kernelversion


      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive

          git submodule update \
            --init \
            --depth=1

          echo "========================================"
          echo "KERNELSU COMMIT"
          echo "========================================"

          git -C KernelSU rev-parse HEAD

          echo "========================================"
          echo "VERIFY KERNELSU"
          echo "========================================"

          test -d KernelSU
          test -d KernelSU/kernel

          ls -lah KernelSU


      # ============================================================
      # 4. PREPARE SOURCE LAYOUT
      # ============================================================
      - name: Prepare Source Layout
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "SOURCE TREE"
          echo "========================================"

          ls -lah

          echo "========================================"
          echo "CREATE COMPATIBILITY SYMLINKS"
          echo "========================================"

          if [ ! -e kernel-5.10 ]; then
            ln -s . kernel-5.10
          fi

          if [ ! -e build ]; then
            ln -s setup/kernel/build build
          fi

          echo "========================================"
          echo "VERIFY SYMLINKS"
          echo "========================================"

          ls -ld kernel-5.10
          ls -ld build

          test -f kernel-5.10/Makefile
          test -f build/build.sh

          echo "========================================"
          echo "BUILD SYSTEM FOUND"
          echo "========================================"

          ls -lh build/build.sh


      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG r416183b
      # ============================================================
      - name: Download Android Clang r416183b
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "PREPARE CLANG DIRECTORY"
          echo "========================================"

          mkdir -p \
            prebuilts-master/clang/host/linux-x86

          cd prebuilts-master/clang/host/linux-x86

          echo "========================================"
          echo "DOWNLOAD CLANG r416183b"
          echo "========================================"

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz" \
            -o clang-r416183b.tar.gz

          echo "========================================"
          echo "EXTRACT CLANG"
          echo "========================================"

          mkdir -p clang-r416183b

          tar \
            -xzf clang-r416183b.tar.gz \
            -C clang-r416183b

          rm -f clang-r416183b.tar.gz

          echo "========================================"
          echo "VERIFY CLANG"
          echo "========================================"

          ls -lah clang-r416183b

          test -x clang-r416183b/bin/clang
          test -x clang-r416183b/bin/ld.lld

          clang-r416183b/bin/clang --version


      # ============================================================
      # 6. CONVERT MTK PYTHON GENERATOR
      # ============================================================
      - name: Convert MTK Config Generator To Python 3
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "CHECK PYTHON GENERATOR"
          echo "========================================"

          grep -n "print '" scripts/gen_build_config.py || true

          echo "========================================"
          echo "CHECK 2TO3"
          echo "========================================"

          command -v 2to3
          2to3 --help >/dev/null

          echo "========================================"
          echo "BACKUP PYTHON GENERATOR"
          echo "========================================"

          cp \
            scripts/gen_build_config.py \
            scripts/gen_build_config.py.orig

          echo "========================================"
          echo "CONVERT PYTHON 2 -> PYTHON 3"
          echo "========================================"

          2to3 -w scripts/gen_build_config.py

          echo "========================================"
          echo "VERIFY PYTHON 3 SYNTAX"
          echo "========================================"

          python3 \
            -m py_compile \
            scripts/gen_build_config.py

          echo "Generator conversion OK"


      # ============================================================
      # 7. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate Build Config
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "GENERATE BUILD CONFIG"
          echo "========================================"

          mkdir -p out

          cd kernel-5.10

          python3 \
            scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o ../out/build.config

          echo "========================================"
          echo "GENERATED BUILD CONFIG"
          echo "========================================"

          cat ../out/build.config


      # ============================================================
      # 8. PATCH / VERIFY TOOLCHAIN CONFIG
      # ============================================================
      - name: Patch Generated Toolchain Path
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "CHECK GENERATED CONFIG"
          echo "========================================"

          grep -n \
            "CLANG_PREBUILT_BIN\|KERNEL_DIR\|CROSS_COMPILE\|MAKE_GOALS" \
            out/build.config || true

          echo "========================================"
          echo "VERIFY CLANG"
          echo "========================================"

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/ld.lld

          echo "========================================"
          echo "PATCH CLANG PATH IF NEEDED"
          echo "========================================"

          if grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            sed -i \
              "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin#" \
              out/build.config
          else
            echo "CLANG_PREBUILT_BIN=${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin" \
              >> out/build.config
          fi

          echo "========================================"
          echo "FINAL CLANG CONFIG"
          echo "========================================"

          grep -n "CLANG_PREBUILT_BIN" out/build.config


      # ============================================================
      # 9. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "START KERNEL BUILD"
          echo "========================================"

          export ARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export OUT_DIR="${GITHUB_WORKSPACE}/gta9/out"

          export DIST_DIR="${GITHUB_WORKSPACE}/gta9/out"

          export BUILD_CONFIG="${GITHUB_WORKSPACE}/gta9/out/build.config"

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}"

          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          "${CLANG_PREBUILT_BIN}/clang" --version

          echo "========================================"
          echo "VERIFY BUILD SCRIPT"
          echo "========================================"

          test -x build/build.sh

          echo "========================================"
          echo "RUN AOSP KERNEL BUILD"
          echo "========================================"

          ./build/build.sh \
            LLVM_IAS=1 \
            -j"$(nproc)"


      # ============================================================
      # 10. INSPECT BUILD OUTPUT
      # ============================================================
      - name: Inspect Build Output
        if: always()
        working-directory: gta9
        run: |
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find out \
            -maxdepth 7 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "vmlinux" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "*.ko" \
            \) \
            -print 2>/dev/null || true

          echo "========================================"
          echo "DIST OUTPUT"
          echo "========================================"

          find out \
            -maxdepth 6 \
            -type f \
            -path "*/dist/*" \
            -print 2>/dev/null || true


      # ============================================================
      # 11. PREPARE ARTIFACTS
      # ============================================================
      - name: Prepare GTA9 Artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "PREPARE ARTIFACTS"
          echo "========================================"

          mkdir -p artifact

          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              artifact/Image.gz
          fi

          if [ -d out/kernel-5.10/arch/arm64/boot/dts ]; then
            find \
              out/kernel-5.10/arch/arm64/boot/dts \
              -type f \
              -name "*.dtb" \
              -exec cp {} artifact/ \;
          fi

          if [ -d out/kernel-5.10/arch/arm64/boot/dts ]; then
            find \
              out/kernel-5.10/arch/arm64/boot/dts \
              -type f \
              -name "*.dtbo" \
              -exec cp {} artifact/ \;
          fi

          if [ -d out/dist ]; then
            cp -r \
              out/dist \
              artifact/dist
          fi

          echo "========================================"
          echo "ARTIFACT CONTENT"
          echo "========================================"

          find artifact \
            -type f \
            -print


      # ============================================================
      # 12. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: |
            gta9/artifact/**
            gta9/out/build.config
            gta9/out/build.config.mtk
            gta9/out/build.config.gki.aarch64
          if-no-files-found: warn
