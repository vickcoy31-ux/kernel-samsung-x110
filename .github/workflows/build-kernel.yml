name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libxml2 \
            libxml2-dev \
            libc6-dev \
            python3 \
            python3-distutils \
            python3-pip \
            cpio \
            rsync \
            unzip \
            wget \
            curl \
            file \
            binutils \
            device-tree-compiler

      # ============================================================
      # 2. CLONE SOURCE
      # ============================================================
      - name: Clone kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

      # ============================================================
      # 3. KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          test -d KernelSU
          test -f kernel/configs/ot11.config

          echo "=== KERNELSU CONFIG ==="
          grep -n "CONFIG_KSU" kernel/configs/ot11.config

      # ============================================================
      # 4. COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare compatibility layout
        working-directory: gta9
        run: |
          set -eux

          rm -f kernel-5.10
          ln -s . kernel-5.10

          rm -f build
          ln -s setup/kernel/build build

          test -L kernel-5.10
          test -L build

          echo "kernel-5.10:"
          readlink -f kernel-5.10

          echo "build:"
          readlink -f build

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang r416183b
        working-directory: gta9
        run: |
          set -eux

          mkdir -p \
            prebuilts-master/clang/host/linux-x86/clang-r416183b

          wget -q \
            -O /tmp/clang-r416183b.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C prebuilts-master/clang/host/linux-x86/clang-r416183b

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/clang++"
          test -x "${CLANG_BIN}/lld"
          test -x "${CLANG_BIN}/ld.lld"

          echo "=== CLANG ==="
          "${CLANG_BIN}/clang" --version

      # ============================================================
      # 6. LLD LIBXML2 COMPATIBILITY
      # ============================================================
      - name: Prepare LLD libxml2 compatibility
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          COMPAT_DIR="${CLANG_BIN}/compat-libs"

          mkdir -p "${COMPAT_DIR}"

          echo "=== SYSTEM LIBXML2 ==="

          ldconfig -p | grep 'libxml2.so.2' || true

          LIBXML2_REAL="$(
            ldconfig -p |
            awk '$1 == "libxml2.so.2" {print $NF; exit}'
          )"

          if [ -z "${LIBXML2_REAL}" ]; then
            LIBXML2_REAL="$(
              find /usr/lib /lib \
                -type f \
                \( \
                  -name 'libxml2.so.2' \
                  -o \
                  -name 'libxml2.so.2.*' \
                \) \
                2>/dev/null |
                head -n 1
            )"
          fi

          echo "Resolved libxml2:"
          echo "${LIBXML2_REAL}"

          test -n "${LIBXML2_REAL}"
          test -f "${LIBXML2_REAL}"

          ln -sfn \
            "${LIBXML2_REAL}" \
            "${COMPAT_DIR}/libxml2.so.2.9.10"

          echo
          echo "=== COMPAT LIBRARY ==="
          ls -la "${COMPAT_DIR}"

          echo
          echo "=== LLD DEPENDENCIES ==="
          readelf -d "${CLANG_BIN}/lld" |
            grep NEEDED || true

          echo
          echo "=== LDD LLD ==="
          LD_LIBRARY_PATH="${COMPAT_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            ldd "${CLANG_BIN}/lld" || true

          echo
          echo "=== LLD TEST ==="
          LD_LIBRARY_PATH="${COMPAT_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            "${CLANG_BIN}/ld.lld" --version

          echo \
            "LD_LIBRARY_PATH=${COMPAT_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            >> "${GITHUB_ENV}"

      # ============================================================
      # 7. CONVERT PYTHON 2 BUILD GENERATOR
      # ============================================================
      - name: Convert build config generator
        working-directory: gta9
        run: |
          set -eux

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

      # ============================================================
      # 8. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate build config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          test -f out/build.config

          echo "=== BUILD CONFIG ==="
          sed -n '1,240p' out/build.config

      # ============================================================
      # 9. PATCH CLANG PATH
      # ============================================================
      - name: Patch build config
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          if grep -q '^CLANG_PREBUILT_BIN=' out/build.config; then
            sed -i \
              "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_BIN}#" \
              out/build.config
          else
            echo "CLANG_PREBUILT_BIN=${CLANG_BIN}" \
              >> out/build.config
          fi

          echo "=== CLANG PATH ==="
          grep -n "CLANG_PREBUILT_BIN" out/build.config

      # ============================================================
      # 10. PREPARE INTERNAL HOST TOOLS
      # ============================================================
      - name: Prepare internal build tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"
          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          mkdir -p "${BUILD_TOOLS_DIR}"

          # --------------------------------------------------------
          # IMPORTANT:
          # Resolve system commands BEFORE putting them into the
          # restricted internal PATH.
          # --------------------------------------------------------

          declare -A HOST_COMMANDS

          HOST_COMMANDS[bash]="/usr/bin/bash"
          HOST_COMMANDS[cat]="/usr/bin/cat"
          HOST_COMMANDS[cp]="/usr/bin/cp"
          HOST_COMMANDS[cpio]="/usr/bin/cpio"
          HOST_COMMANDS[cut]="/usr/bin/cut"
          HOST_COMMANDS[date]="/usr/bin/date"
          HOST_COMMANDS[dirname]="/usr/bin/dirname"
          HOST_COMMANDS[echo]="/usr/bin/echo"
          HOST_COMMANDS[env]="/usr/bin/env"
          HOST_COMMANDS[expr]="/usr/bin/expr"
          HOST_COMMANDS[file]="/usr/bin/file"
          HOST_COMMANDS[find]="/usr/bin/find"
          HOST_COMMANDS[grep]="/usr/bin/grep"
          HOST_COMMANDS[head]="/usr/bin/head"
          HOST_COMMANDS[ln]="/usr/bin/ln"
          HOST_COMMANDS[mkdir]="/usr/bin/mkdir"
          HOST_COMMANDS[mktemp]="/usr/bin/mktemp"
          HOST_COMMANDS[mv]="/usr/bin/mv"
          HOST_COMMANDS[nproc]="/usr/bin/nproc"
          HOST_COMMANDS[pwd]="/usr/bin/pwd"
          HOST_COMMANDS[readlink]="/usr/bin/readlink"
          HOST_COMMANDS[realpath]="/usr/bin/realpath"
          HOST_COMMANDS[rm]="/usr/bin/rm"
          HOST_COMMANDS[sed]="/usr/bin/sed"
          HOST_COMMANDS[sort]="/usr/bin/sort"
          HOST_COMMANDS[stat]="/usr/bin/stat"
          HOST_COMMANDS[tail]="/usr/bin/tail"
          HOST_COMMANDS[tar]="/usr/bin/tar"
          HOST_COMMANDS[tr]="/usr/bin/tr"
          HOST_COMMANDS[true]="/usr/bin/true"
          HOST_COMMANDS[uname]="/usr/bin/uname"
          HOST_COMMANDS[uniq]="/usr/bin/uniq"
          HOST_COMMANDS[which]="/usr/bin/which"
          HOST_COMMANDS[xargs]="/usr/bin/xargs"
          HOST_COMMANDS[awk]="/usr/bin/awk"
          HOST_COMMANDS[diff]="/usr/bin/diff"
          HOST_COMMANDS[cmp]="/usr/bin/cmp"
          HOST_COMMANDS[printf]="/usr/bin/printf"
          HOST_COMMANDS[basename]="/usr/bin/basename"
          HOST_COMMANDS[sh]="/usr/bin/sh"

          for cmd in "${!HOST_COMMANDS[@]}"; do
            real="${HOST_COMMANDS[$cmd]}"

            if [ -x "${real}" ]; then
              ln -sfn \
                "${real}" \
                "${BUILD_TOOLS_DIR}/${cmd}"
            fi
          done

          # --------------------------------------------------------
          # MAKE
          # --------------------------------------------------------

          ln -sfn \
            /usr/bin/make \
            "${BUILD_TOOLS_DIR}/make"

          # --------------------------------------------------------
          # CLANG
          # --------------------------------------------------------

          cp -f \
            "${CLANG_BIN}/clang" \
            "${BUILD_TOOLS_DIR}/clang"

          cp -f \
            "${CLANG_BIN}/clang++" \
            "${BUILD_TOOLS_DIR}/clang++"

          chmod +x \
            "${BUILD_TOOLS_DIR}/clang" \
            "${BUILD_TOOLS_DIR}/clang++"

          if [ -f "${CLANG_BIN}/clang-12" ]; then
            cp -f \
              "${CLANG_BIN}/clang-12" \
              "${BUILD_TOOLS_DIR}/clang-12"

            chmod +x \
              "${BUILD_TOOLS_DIR}/clang-12"
          fi

          ln -sfn \
            clang-12 \
            "${BUILD_TOOLS_DIR}/clang.real"

          ln -sfn \
            clang.real \
            "${BUILD_TOOLS_DIR}/clang++.real"

          # --------------------------------------------------------
          # LLD
          # --------------------------------------------------------

          cp -f \
            "${CLANG_BIN}/lld" \
            "${BUILD_TOOLS_DIR}/lld"

          chmod +x \
            "${BUILD_TOOLS_DIR}/lld"

          ln -sfn \
            lld \
            "${BUILD_TOOLS_DIR}/ld.lld"

          # --------------------------------------------------------
          # LLVM UTILITIES
          # --------------------------------------------------------

          for tool in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip \
            llvm-ranlib \
            llvm-size \
            llvm-strings
          do
            if [ -e "${CLANG_BIN}/${tool}" ]; then
              cp -f \
                "${CLANG_BIN}/${tool}" \
                "${BUILD_TOOLS_DIR}/${tool}"

              chmod +x \
                "${BUILD_TOOLS_DIR}/${tool}"
            fi
          done

          echo
          echo "=== INTERNAL TOOL COUNT ==="

          ls -la "${BUILD_TOOLS_DIR}" |
            head -n 150

      # ============================================================
      # 11. VERIFY INTERNAL TOOLS + HOST COMPILER
      # ============================================================
      - name: Verify internal tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"
          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "========================================"
          echo "INTERNAL TOOLS"
          echo "========================================"

          echo
          echo "=== MAKE ==="
          test -x "${BUILD_TOOLS_DIR}/make"
          "${BUILD_TOOLS_DIR}/make" --version | head -n 1

          echo
          echo "=== CLANG ==="
          test -x "${BUILD_TOOLS_DIR}/clang"

          echo
          echo "=== CLANG REAL ==="
          ls -la "${BUILD_TOOLS_DIR}/clang.real"

          echo
          echo "=== CLANG++ ==="
          test -x "${BUILD_TOOLS_DIR}/clang++"

          echo
          echo "=== LLD ==="
          test -x "${BUILD_TOOLS_DIR}/lld"
          test -x "${BUILD_TOOLS_DIR}/ld.lld"

          echo
          echo "=== LLD VERSION ==="
          "${BUILD_TOOLS_DIR}/ld.lld" --version

          echo
          echo "=== CLANG VERSION ==="
          "${BUILD_TOOLS_DIR}/clang" --version

          echo
          echo "=== CLANG HOST INCLUDE SEARCH ==="

          echo | \
            "${CLANG_BIN}/clang" \
              --gcc-toolchain=/usr \
              -E \
              -v \
              -x c \
              - \
              >/tmp/clang-preprocessor.out \
              2>/tmp/clang-includes.txt || true

          cat /tmp/clang-includes.txt

          echo
          echo "=== TEST sys/types.h ==="

          printf '#include <sys/types.h>\nint main(void){return 0;}\n' \
            >/tmp/test-host.c

          "${CLANG_BIN}/clang" \
            --gcc-toolchain=/usr \
            -fsyntax-only \
            /tmp/test-host.c

          echo
          echo "sys/types.h OK"

      # ============================================================
      # 12. VERIFY KERNELSU + CONFIG
      # ============================================================
      - name: Verify KernelSU and config
        working-directory: gta9
        run: |
          set -eux

          echo "=== KERNELSU ==="
          grep -n "CONFIG_KSU=y" \
            kernel/configs/ot11.config

          echo
          echo "=== BUILD CONFIG ==="
          test -f out/build.config

          grep -n \
            -E \
            'KERNEL_DIR|CLANG_PREBUILT_BIN|ARCH=|CROSS_COMPILE=' \
            out/build.config || true

      # ============================================================
      # 13. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: gta9
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          BUILD_CONFIG: out/build.config
          OUT_DIR: out
          DIST_DIR: out/dist
          HOSTCFLAGS: "--gcc-toolchain=/usr"
          HOSTCXXFLAGS: "--gcc-toolchain=/usr"
          KBUILD_HOSTCFLAGS: "--gcc-toolchain=/usr"
          KBUILD_HOSTCXXFLAGS: "--gcc-toolchain=/usr"
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "=== BUILD ENVIRONMENT ==="

          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT}"
          echo "LLVM=${LLVM}"
          echo "LLVM_IAS=${LLVM_IAS}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"

          echo
          echo "=== LLD ==="

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          "${BUILD_TOOLS_DIR}/ld.lld" --version

          echo
          echo "=== ANDROID CLANG ==="

          "${CLANG_BIN}/clang" --version

          echo
          echo "=== HOST HEADER TEST ==="

          printf '#include <sys/types.h>\nint main(void){return 0;}\n' \
            >/tmp/test-host.c

          "${CLANG_BIN}/clang" \
            --gcc-toolchain=/usr \
            -fsyntax-only \
            /tmp/test-host.c

          echo
          echo "HOST HEADER TEST PASSED"

          echo
          echo "=== BUILD CONFIG EXISTS ==="

          test -f out/build.config

          echo
          echo "=== START BUILD ==="

          ./build/build.sh \
            LLVM_IAS=1 \
            HOSTCFLAGS="--gcc-toolchain=/usr" \
            HOSTCXXFLAGS="--gcc-toolchain=/usr" \
            KBUILD_HOSTCFLAGS="--gcc-toolchain=/usr" \
            KBUILD_HOSTCXXFLAGS="--gcc-toolchain=/usr" \
            -j$(($(nproc)-1))

      # ============================================================
      # 14. INSPECT OUTPUT
      # ============================================================
      - name: Inspect build output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          echo
          echo "=== OUT ==="

          find out \
            -maxdepth 6 \
            -type f \
            2>/dev/null |
            sort |
            head -n 400

          echo
          echo "=== DIST ==="

          find out/dist \
            -maxdepth 6 \
            -type f \
            2>/dev/null |
            sort |
            head -n 400

          echo
          echo "=== KERNEL OUTPUTS ==="

          find out \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'vmlinux' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            2>/dev/null |
            sort

      # ============================================================
      # 15. RELEASE
      # ============================================================
      - name: Prepare release files
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out/release

          find out \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            -exec cp -v {} out/release/ \;

          echo
          echo "=== RELEASE ==="

          ls -lah out/release

      # ============================================================
      # 16. UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: gta9/out/release/
          if-no-files-found: error

      # ============================================================
      # 17. DEBUG
      # ============================================================
      - name: Collect debug information
        if: failure()
        working-directory: gta9
        run: |
          set +e

          mkdir -p debug

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"
          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          {
            echo "========================================"
            echo "BUILD DEBUG"
            echo "========================================"

            echo
            echo "=== BUILD CONFIG ==="
            cat out/build.config

            echo
            echo "=== INTERNAL TOOLS ==="
            ls -la "${BUILD_TOOLS_DIR}"

            echo
            echo "=== LDD LLD ==="
            ldd "${BUILD_TOOLS_DIR}/lld"

            echo
            echo "=== LLD VERSION ==="
            "${BUILD_TOOLS_DIR}/ld.lld" --version

            echo
            echo "=== CLANG VERSION ==="
            "${CLANG_BIN}/clang" --version

            echo
            echo "=== LIBXML2 ==="
            ldconfig -p | grep libxml2

            echo
            echo "=== CLANG INCLUDE PATHS ==="
            cat /tmp/clang-includes.txt 2>/dev/null || true

            echo
            echo "=== KERNELSU ==="
            grep -n "CONFIG_KSU" kernel/configs/ot11.config

            echo
            echo "=== OUTPUT FILES ==="
            find out \
              -maxdepth 6 \
              -type f \
              2>/dev/null |
              sort

          } > debug/build-debug.txt 2>&1

      # ============================================================
      # 18. UPLOAD DEBUG
      # ============================================================
      - name: Upload debug artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-build-debug
          path: gta9/debug/
          if-no-files-found: warn
