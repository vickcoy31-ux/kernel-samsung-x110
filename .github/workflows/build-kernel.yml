name: Build Samsung X110 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl ccache

      - name: Clone Toolchain & Source
        run: |
          echo "Mengunduh GCC Toolchain..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-18.1 toolchain-64
          
          echo "Mengunduh Source Code Kernel Samsung GTA9..."
          git clone --depth=1 https://github.com/0xA11CE613/kernel_samsung_gta9.git kernel_source

      - name: Start Full Compilation
        run: |
          cd kernel_source || exit 1
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/../toolchain-64/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          
          echo "Mencari file defconfig GTA9..."
          DEFCONFIG_FILE=$(ls arch/arm64/configs/ | grep -iE 'gta9|x110' | head -n 1)
          if [ -n "$DEFCONFIG_FILE" ]; then
            echo "Menggunakan config: $DEFCONFIG_FILE"
            make $DEFCONFIG_FILE
          else
            echo "Menggunakan defconfig fallback..."
            make defconfig
          fi
          
          echo "Memproses kompilasi kernel..."
          make -j$(nproc) Image
