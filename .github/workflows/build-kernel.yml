      - name: Inject KernelSU
        run: |
          set -e

          echo "=== Mencari root kernel ==="

          TARGET_DIR=$(find . -maxdepth 3 -type f \
            -path "*/drivers/Kconfig" \
            -print -quit | sed 's|/drivers/Kconfig$||')

          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: drivers/Kconfig tidak ditemukan"
            exit 1
          fi

          cd "$TARGET_DIR"

          echo "Kernel source: $(pwd)"

          echo "=== Membersihkan KernelSU lama ==="

          rm -rf drivers/kernelsu

          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile

          echo "=== Mengambil KernelSU ==="

          git clone --depth=1 \
            https://github.com/tiann/KernelSU.git \
            /tmp/KernelSU

          echo "=== Memasang source KernelSU ==="

          ln -s /tmp/KernelSU/kernel drivers/kernelsu

          echo "=== Mendaftarkan KernelSU ==="

          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          echo "=== Verifikasi ==="

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU berhasil dipasang."
