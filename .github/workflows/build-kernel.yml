name: Build Samsung X110 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/Samsung/samsung-kernel-release.git kernel_source || true
          
      - name: Setup Build Configuration
        run: |
          cd kernel_source || exit 0
          echo "Menyiapkan variabel kompilasi..."
          export ARCH=arm64
          export SUBARCH=arm64
          echo "Arsitektur diset ke arm64"
          
      - name: Test Make Clean / Config Prep
        run: |
          cd kernel_source || exit 0
          echo "Environment kompilasi siap dirakit!"
          pwd
          ls -la
