name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libxml2 \
            libxml2-dev \
            python3 \
            python3-distutils \
            python3-pip \
            cpio \
            rsync \
            unzip \
            wget \
            curl \
            file \
            binutils \
            device-tree-compiler

      # ============================================================
      # 2. CLONE SOURCE
      # ============================================================
      - name: Clone kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

      # ============================================================
      # 3. KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          test -d KernelSU
          test -f kernel/configs/ot11.config

          grep -n "CONFIG_KSU" kernel/configs/ot11.config

      # ============================================================
      # 4. COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare compatibility layout
        working-directory: gta9
        run: |
          set -eux

          rm -f kernel-5.10
          ln -s . kernel-5.10

          rm -f build
          ln -s setup/kernel/build build

          test -L kernel-5.10
          test -L build

          echo "kernel-5.10:"
          readlink -f kernel-5.10

          echo "build:"
          readlink -f build

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang r416183b
        working-directory: gta9
        run: |
          set -eux

          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b

          wget -q \
            -O /tmp/clang-r416183b.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C prebuilts-master/clang/host/linux-x86/clang-r416183b

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang++

          echo "CLANG:"
          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang --version

          echo
          echo "LLD:"
          ls -l \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/lld

      # ============================================================
      # 6. CREATE LLD LIBXML2 COMPATIBILITY LIBRARY
      # ============================================================
      - name: Prepare LLD libxml2 compatibility
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          COMPAT_DIR="${CLANG_BIN}/compat-libs"

          mkdir -p "${COMPAT_DIR}"

          echo "=== SYSTEM LIBXML2 ==="
          ldconfig -p | grep 'libxml2.so.2' || true

          LIBXML2_REAL="$(ldconfig -p | awk '$1 == "libxml2.so.2" {print $NF; exit}')"

          if [ -z "${LIBXML2_REAL}" ]; then
            LIBXML2_REAL="$(find /usr/lib /lib \
              -type f \
              \( -name 'libxml2.so.2' -o -name 'libxml2.so.2.*' \) \
              2>/dev/null | head -n 1)"
          fi

          echo "Resolved libxml2:"
          echo "${LIBXML2_REAL}"

          test -n "${LIBXML2_REAL}"
          test -f "${LIBXML2_REAL}"

          # Android Clang r416183b LLD asks specifically for:
          # libxml2.so.2.9.10
          #
          # Ubuntu 22.04 normally provides a compatible libxml2.so.2.
          # Create a private compatibility filename rather than replacing
          # the system library.
          ln -sfn \
            "${LIBXML2_REAL}" \
            "${COMPAT_DIR}/libxml2.so.2.9.10"

          echo
          echo "=== COMPAT LIBRARY ==="
          ls -la "${COMPAT_DIR}/"

          echo
          echo "=== LLD NEEDED LIBRARIES ==="
          readelf -d "${CLANG_BIN}/lld" | grep NEEDED || true

          echo
          echo "=== LDD WITH COMPAT PATH ==="
          LD_LIBRARY_PATH="${COMPAT_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            ldd "${CLANG_BIN}/lld" || true

          # Persist for all following GitHub Actions steps.
          echo "LD_LIBRARY_PATH=${COMPAT_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      # ============================================================
      # 7. VERIFY ORIGINAL CLANG
      # ============================================================
      - name: Verify Android Clang
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "=== CLANG VERSION ==="
          "${CLANG_BIN}/clang" --version

          echo
          echo "=== CLANG++ VERSION ==="
          "${CLANG_BIN}/clang++" --version

          echo
          echo "=== LLD VERSION WITH COMPAT ==="
          LD_LIBRARY_PATH="${CLANG_BIN}/compat-libs${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            "${CLANG_BIN}/ld.lld" --version

      # ============================================================
      # 8. GENERATOR PYTHON 2 -> PYTHON 3
      # ============================================================
      - name: Convert build config generator to Python 3
        working-directory: gta9
        run: |
          set -eux

          python3 -m lib2to3 -w scripts/gen_build_config.py

          python3 -m py_compile scripts/gen_build_config.py

      # ============================================================
      # 9. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate build config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          test -f out/build.config

          echo "=== GENERATED BUILD CONFIG ==="
          sed -n '1,240p' out/build.config

      # ============================================================
      # 10. PATCH CLANG PATH
      # ============================================================
      - name: Patch generated build config
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          sed -i \
            "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_BIN}#" \
            out/build.config

          if ! grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            echo "CLANG_PREBUILT_BIN=${CLANG_BIN}" >> out/build.config
          fi

          echo "=== CLANG CONFIG ==="
          grep -n "CLANG_PREBUILT_BIN" out/build.config

      # ============================================================
      # 11. PREPARE INTERNAL BUILD TOOLS
      # ============================================================
      - name: Prepare internal build tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"
          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          mkdir -p "${BUILD_TOOLS_DIR}"

          # --------------------------------------------------------
          # HOST COMMANDS
          # --------------------------------------------------------
          for cmd in \
            bash \
            cat \
            cp \
            cpio \
            cut \
            date \
            dirname \
            echo \
            find \
            grep \
            head \
            ln \
            mkdir \
            mktemp \
            mv \
            nproc \
            readlink \
            rm \
            sed \
            sort \
            stat \
            tail \
            tar \
            test \
            touch \
            tr \
            uname \
            uniq \
            xargs \
            which \
            file \
            awk \
            diff \
            cmp \
            python3
          do
            REAL="$(command -v "${cmd}" || true)"

            if [ -n "${REAL}" ]; then
              ln -sfn "${REAL}" "${BUILD_TOOLS_DIR}/${cmd}"
            fi
          done

          # --------------------------------------------------------
          # MAKE
          # --------------------------------------------------------
          ln -sfn /usr/bin/make "${BUILD_TOOLS_DIR}/make"

          # --------------------------------------------------------
          # CLANG WRAPPERS + REAL BINARIES
          # --------------------------------------------------------
          cp -f "${CLANG_BIN}/clang" "${BUILD_TOOLS_DIR}/clang"
          cp -f "${CLANG_BIN}/clang++" "${BUILD_TOOLS_DIR}/clang++"

          chmod +x \
            "${BUILD_TOOLS_DIR}/clang" \
            "${BUILD_TOOLS_DIR}/clang++"

          # clang wrapper expects clang.real next to it
          ln -sfn clang-12 \
            "${BUILD_TOOLS_DIR}/clang.real"

          # clang++ wrapper expects clang++.real
          ln -sfn clang.real \
            "${BUILD_TOOLS_DIR}/clang++.real"

          # Actual clang-12 binary
          if [ -f "${CLANG_BIN}/clang-12" ]; then
            cp -f "${CLANG_BIN}/clang-12" \
              "${BUILD_TOOLS_DIR}/clang-12"

            chmod +x \
              "${BUILD_TOOLS_DIR}/clang-12"
          fi

          # --------------------------------------------------------
          # LLD
          # --------------------------------------------------------
          cp -f "${CLANG_BIN}/lld" \
            "${BUILD_TOOLS_DIR}/lld"

          chmod +x \
            "${BUILD_TOOLS_DIR}/lld"

          ln -sfn lld \
            "${BUILD_TOOLS_DIR}/ld.lld"

          # lld may also expect companion llvm tools.
          for tool in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip \
            llvm-ranlib \
            llvm-size \
            llvm-strings
          do
            if [ -e "${CLANG_BIN}/${tool}" ]; then
              cp -f "${CLANG_BIN}/${tool}" \
                "${BUILD_TOOLS_DIR}/${tool}"
              chmod +x "${BUILD_TOOLS_DIR}/${tool}"
            fi
          done

          echo
          echo "=== INTERNAL TOOLS ==="
          ls -la "${BUILD_TOOLS_DIR}" | head -n 100

      # ============================================================
      # 12. VERIFY INTERNAL TOOLS
      # ============================================================
      - name: Verify internal tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          echo "========================================"
          echo "INTERNAL TOOLS"
          echo "========================================"

          echo
          echo "=== MAKE ==="
          ls -la "${BUILD_TOOLS_DIR}/make"
          readlink -f "${BUILD_TOOLS_DIR}/make"
          "${BUILD_TOOLS_DIR}/make" --version

          echo
          echo "=== CLANG ==="
          ls -la "${BUILD_TOOLS_DIR}/clang"
          test -x "${BUILD_TOOLS_DIR}/clang"

          echo
          echo "=== CLANG REAL ==="
          ls -la "${BUILD_TOOLS_DIR}/clang.real"

          echo
          echo "=== CLANG++ ==="
          ls -la "${BUILD_TOOLS_DIR}/clang++"
          test -x "${BUILD_TOOLS_DIR}/clang++"

          echo
          echo "=== CLANG++ REAL ==="
          ls -la "${BUILD_TOOLS_DIR}/clang++.real"

          echo
          echo "=== LLD ==="
          ls -la "${BUILD_TOOLS_DIR}/lld"

          echo
          echo "=== LD.LLD ==="
          ls -la "${BUILD_TOOLS_DIR}/ld.lld"

          echo
          echo "=== RESOLVED LLD ==="
          readlink -f "${BUILD_TOOLS_DIR}/lld"

          echo
          echo "=== RESOLVED LD.LLD ==="
          readlink -f "${BUILD_TOOLS_DIR}/ld.lld"

          test -x "${BUILD_TOOLS_DIR}/lld"
          test -x "${BUILD_TOOLS_DIR}/ld.lld"

          echo
          echo "=== LLD DEPENDENCIES ==="
          ldd "${BUILD_TOOLS_DIR}/lld" || true

          echo
          echo "=== LLD VERSION ==="
          "${BUILD_TOOLS_DIR}/ld.lld" --version

          echo
          echo "=== CLANG VERSION ==="
          "${BUILD_TOOLS_DIR}/clang" --version

      # ============================================================
      # 13. VERIFY CONFIG
      # ============================================================
      - name: Verify KernelSU and build config
        working-directory: gta9
        run: |
          set -eux

          echo "=== KERNELSU ==="
          grep -n "CONFIG_KSU=y" kernel/configs/ot11.config

          echo
          echo "=== DEFCONFIG ==="
          grep -n \
            -E \
            'CONFIG_BUILD_CONFIG_FILE|CONFIG_KSU|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11' \
            arch/arm64/configs/gta9_00_defconfig \
            kernel/configs/ot11.config \
            kernel/configs/ot11_wifi.config \
            kernel/configs/ot11_data.config

          echo
          echo "=== BUILD CONFIG ==="
          test -f out/build.config
          grep -n \
            -E \
            'KERNEL_DIR|CLANG_PREBUILT_BIN|ARCH=|CROSS_COMPILE=|LLVM_IAS' \
            out/build.config || true

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build kernel
        working-directory: gta9
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          BUILD_CONFIG: out/build.config
          OUT_DIR: out
          DIST_DIR: out/dist
          HOSTCC: /home/runner/work/kernel-samsung-x110/kernel-samsung-x110/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang
          HOSTCXX: /home/runner/work/kernel-samsung-x110/kernel-samsung-x110/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang++
          HOSTLD: /home/runner/work/kernel-samsung-x110/kernel-samsung-x110/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/ld.lld
          LD: /home/runner/work/kernel-samsung-x110/kernel-samsung-x110/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/ld.lld
        run: |
          set -eux

          echo "=== BUILD ENVIRONMENT ==="
          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT}"
          echo "LLVM=${LLVM}"
          echo "LLVM_IAS=${LLVM_IAS}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"

          echo
          echo "=== LLD BEFORE BUILD ==="
          ld.lld --version || true

          echo
          echo "=== CLANG BEFORE BUILD ==="
          clang --version || true

          echo
          echo "=== BUILD CONFIG EXISTS ==="
          test -f out/build.config

          echo
          echo "=== START BUILD ==="

          ./build/build.sh LLVM_IAS=1 -j$(($(nproc)-1))

      # ============================================================
      # 15. INSPECT OUTPUT
      # ============================================================
      - name: Inspect build output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          echo
          echo "=== OUT ==="
          find out -maxdepth 5 -type f 2>/dev/null | sort | head -n 300

          echo
          echo "=== DIST ==="
          find out/dist -maxdepth 5 -type f 2>/dev/null | sort | head -n 300

          echo
          echo "=== KERNEL IMAGE ==="
          find out \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'vmlinux' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            2>/dev/null | sort

      # ============================================================
      # 16. PACKAGE RELEASE
      # ============================================================
      - name: Prepare release files
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out/release

          find out \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            -exec cp -v {} out/release/ \;

          echo
          echo "=== RELEASE FILES ==="
          ls -lah out/release

      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: gta9/out/release/
          if-no-files-found: error

      # ============================================================
      # 18. DEBUG ARTIFACT IF BUILD FAILS
      # ============================================================
      - name: Collect debug information
        if: failure()
        working-directory: gta9
        run: |
          set +e

          mkdir -p debug

          echo "=== BUILD CONFIG ===" \
            > debug/build-debug.txt

          cat out/build.config \
            >> debug/build-debug.txt \
            2>&1

          echo \
            >> debug/build-debug.txt

          echo "=== INTERNAL TOOLCHAIN ===" \
            >> debug/build-debug.txt

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          ls -la "${BUILD_TOOLS_DIR}" \
            >> debug/build-debug.txt \
            2>&1

          echo \
            >> debug/build-debug.txt

          echo "=== LDD LLD ===" \
            >> debug/build-debug.txt

          ldd "${BUILD_TOOLS_DIR}/lld" \
            >> debug/build-debug.txt \
            2>&1

          echo \
            >> debug/build-debug.txt

          echo "=== LLD VERSION ===" \
            >> debug/build-debug.txt

          "${BUILD_TOOLS_DIR}/ld.lld" --version \
            >> debug/build-debug.txt \
            2>&1

          echo \
            >> debug/build-debug.txt

          echo "=== CLANG VERSION ===" \
            >> debug/build-debug.txt

          "${BUILD_TOOLS_DIR}/clang" --version \
            >> debug/build-debug.txt \
            2>&1

          echo \
            >> debug/build-debug.txt

          echo "=== LIBXML2 ===" \
            >> debug/build-debug.txt

          ldconfig -p | grep libxml2 \
            >> debug/build-debug.txt \
            2>&1

          echo \
            >> debug/build-debug.txt

          echo "=== FILES ===" \
            >> debug/build-debug.txt

          find out \
            -maxdepth 5 \
            -type f \
            >> debug/build-debug.txt \
            2>&1

      - name: Upload debug artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-build-debug
          path: gta9/debug/
          if-no-files-found: warn
