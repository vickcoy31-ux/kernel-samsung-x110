name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            gzip \
            xz-utils \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            libc6-dev \
            libssl-dev \
            libelf-dev \
            libxml2 \
            libxml2-dev \
            python3 \
            python3-pip \
            cpio \
            rsync \
            file \
            ca-certificates

      # ============================================================
      # 2. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone Samsung GTA9 kernel
        run: |
          git clone --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== SOURCE ROOT ==="
          pwd
          echo

          echo "=== SOURCE CHECK ==="
          test -f Makefile
          test -d arch
          test -d drivers
          test -f build.config.mtk.aarch64

          echo "Kernel source OK"

      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "=== KERNELSU ==="
          test -d KernelSU
          test -d KernelSU/kernel

          git -C KernelSU rev-parse HEAD

          echo
          echo "=== KSU CONFIG ==="
          grep -R "^CONFIG_KSU=" kernel/configs || true

      # ============================================================
      # 4. CREATE COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare Android kernel build layout
        working-directory: gta9
        run: |
          set -eux

          rm -rf kernel-5.10
          ln -s . kernel-5.10

          rm -f build
          ln -s setup/kernel/build build

          echo "=== LAYOUT ==="
          ls -la

          echo
          echo "kernel-5.10:"
          readlink -f kernel-5.10

          echo
          echo "build:"
          readlink -f build

          test -f kernel-5.10/Makefile
          test -f build/build.sh

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang r416183b
        working-directory: gta9
        run: |
          set -eux

          CLANG_DIR="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"

          mkdir -p "$CLANG_DIR"

          cd "$CLANG_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          echo "=== VERIFY ARCHIVE ==="
          ls -lh clang.tar.gz
          gzip -t clang.tar.gz

          echo "Archive OK"

          tar -xzf clang.tar.gz

          rm -f clang.tar.gz

          echo
          echo "=== CLANG ==="
          ./bin/clang --version
          ./bin/clang++ --version

          test -x ./bin/clang
          test -x ./bin/clang++

      # ============================================================
      # 6. LLVM LIBRARY COMPATIBILITY
      # ============================================================
      - name: Prepare Clang runtime libraries
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          COMPAT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs"

          mkdir -p "$COMPAT"

          SYSTEM_XML="$(find /usr/lib/x86_64-linux-gnu \
            -maxdepth 1 \
            -type f \
            -name 'libxml2.so.2*' \
            | head -n 1)"

          test -n "$SYSTEM_XML"

          ln -sf "$SYSTEM_XML" "$COMPAT/libxml2.so.2.9.10"

          export LD_LIBRARY_PATH="$COMPAT:${LD_LIBRARY_PATH:-}"

          echo "=== LIBXML2 ==="
          ls -l "$COMPAT/libxml2.so.2.9.10"

          echo
          echo "=== LLD TEST ==="
          LD_LIBRARY_PATH="$COMPAT" "$CLANG_BIN/../bin/ld.lld" --version || true

      # ============================================================
      # 7. CONVERT PYTHON 2 BUILD SCRIPT TO PYTHON 3
      # ============================================================
      - name: Prepare build scripts
        working-directory: gta9
        run: |
          set -eux

          python3 -m lib2to3 -w scripts/gen_build_config.py

          python3 -m py_compile scripts/gen_build_config.py

          echo "Python build generator OK"

      # ============================================================
      # 8. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate build config
        working-directory: gta9
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          echo
          echo "=== BUILD CONFIG ==="
          test -f out/build.config

          sed -n '1,220p' out/build.config

      # ============================================================
      # 9. PATCH CLANG PATH
      # ============================================================
      - name: Configure Clang toolchain
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          sed -i \
            "s|^CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=$CLANG_BIN|" \
            out/build.config

          if ! grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            echo "CLANG_PREBUILT_BIN=$CLANG_BIN" >> out/build.config
          fi

          echo
          echo "=== CLANG CONFIG ==="
          grep -n "CLANG_PREBUILT_BIN" out/build.config

      # ============================================================
      # 10. PREPARE INTERNAL HOST TOOLS
      # ============================================================
      - name: Prepare internal host tools
        working-directory: gta9
        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          CLANG_DIR="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          mkdir -p "$TOOL_DIR"

          echo "=== PREPARE BASIC HOST COMMANDS ==="

          for cmd in \
            bash \
            sh \
            pwd \
            echo \
            printf \
            expr \
            basename \
            dirname \
            readlink \
            realpath \
            mkdir \
            rm \
            cp \
            mv \
            ln \
            chmod \
            chmod \
            touch \
            find \
            grep \
            sed \
            awk \
            cut \
            tr \
            sort \
            uniq \
            head \
            tail \
            cat \
            xargs \
            which \
            env \
            test \
            uname \
            nproc \
            make \
            gcc \
            g++ \
            ar \
            ld \
            objcopy \
            objdump \
            nm \
            strip \
            git \
            python3
          do
            if command -v "$cmd" >/dev/null 2>&1; then
              target="$(command -v "$cmd")"

              rm -f "$TOOL_DIR/$cmd"

              ln -s "$target" "$TOOL_DIR/$cmd"

              echo "$cmd -> $target"
            else
              echo "WARNING: $cmd not found"
            fi
          done

          # ========================================================
          # CLANG
          # ========================================================

          cp -f "$CLANG_DIR/clang" "$TOOL_DIR/clang"

          if [ -f "$CLANG_DIR/clang-12" ]; then
            cp -f "$CLANG_DIR/clang-12" "$TOOL_DIR/clang-12"
          fi

          cp -f "$CLANG_DIR/clang++" "$TOOL_DIR/clang++"

          if [ -f "$CLANG_DIR/clang-cpp" ]; then
            cp -f "$CLANG_DIR/clang-cpp" "$TOOL_DIR/clang-cpp"
          fi

          ln -sf clang "$TOOL_DIR/clang.real"
          ln -sf clang.real "$TOOL_DIR/clang++.real"

          # ========================================================
          # LLD
          # ========================================================

          cp -f "$CLANG_DIR/lld" "$TOOL_DIR/lld"

          rm -f "$TOOL_DIR/ld.lld"
          ln -s lld "$TOOL_DIR/ld.lld"

          # ========================================================
          # LLVM TOOLS
          # ========================================================

          for tool in \
            llvm-ar \
            llvm-as \
            llvm-cfi-verify \
            llvm-cov \
            llvm-dis \
            llvm-dwarfdump \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strings \
            llvm-strip \
            llvm-symbolizer
          do
            if [ -x "$CLANG_DIR/$tool" ]; then
              cp -f "$CLANG_DIR/$tool" "$TOOL_DIR/$tool"
            fi
          done

          echo
          echo "=== INTERNAL TOOL DIRECTORY ==="
          ls -la "$TOOL_DIR"

      # ============================================================
      # 11. HOST HEADER COMPATIBILITY
      # ============================================================
      - name: Prepare host headers and compiler flags
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "=== SYSTEM HEADERS ==="

          find /usr/include \
            -name types.h \
            -o -name stddef.h \
            | head -30

          echo
          echo "=== MULTIARCH HEADERS ==="

          test -f /usr/include/x86_64-linux-gnu/sys/types.h
          test -f /usr/include/x86_64-linux-gnu/bits/types.h

          echo
          echo "=== HOST CLANG TEST ==="

          "$CLANG_BIN/clang" \
            --gcc-toolchain=/usr \
            -isystem /usr/include/x86_64-linux-gnu \
            -isystem /usr/include \
            -x c \
            -c /dev/null \
            -o /tmp/clang-host-test.o

          echo "Host Clang header test PASSED"

      # ============================================================
      # 12. VERIFY INTERNAL TOOLS
      # ============================================================
      - name: Verify internal build tools
        working-directory: gta9
        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          COMPAT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs"

          export LD_LIBRARY_PATH="$COMPAT:${LD_LIBRARY_PATH:-}"

          echo "=== MAKE ==="
          test -x "$TOOL_DIR/make"
          "$TOOL_DIR/make" --version | head -1

          echo
          echo "=== CLANG ==="
          test -x "$TOOL_DIR/clang"
          "$TOOL_DIR/clang" --version | head -2

          echo
          echo "=== CLANG REAL ==="
          test -e "$TOOL_DIR/clang.real"

          echo
          echo "=== CLANG++ ==="
          test -x "$TOOL_DIR/clang++"

          echo
          echo "=== LLD ==="
          test -x "$TOOL_DIR/lld"
          test -x "$TOOL_DIR/ld.lld"

          "$TOOL_DIR/ld.lld" --version | head -1

          echo
          echo "=== REQUIRED COMMANDS ==="

          for cmd in \
            pwd \
            expr \
            basename \
            readlink \
            realpath \
            mkdir \
            rm \
            cp \
            ln \
            uname \
            nproc \
            make
          do
            test -e "$TOOL_DIR/$cmd"
            echo "OK: $cmd"
          done

      # ============================================================
      # 13. VERIFY KERNELSU + CONFIG
      # ============================================================
      - name: Verify KernelSU and kernel config
        working-directory: gta9
        run: |
          set -eux

          echo "=== KERNELSU ==="

          test -d KernelSU
          test -d KernelSU/kernel

          grep -R "^CONFIG_KSU=y" kernel/configs || true

          echo
          echo "=== GTA9 DEFCONFIG ==="

          test -f arch/arm64/configs/gta9_00_defconfig

          grep -E \
            "CONFIG_(ARCH_MEDIATEK|SAMSUNG_GKI_KERNEL|KSU|F2FS_FS)" \
            arch/arm64/configs/gta9_00_defconfig \
            kernel/configs/ot11.config \
            || true

          echo
          echo "KernelSU/config verification complete"

      # ============================================================
      # 14. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: gta9
        env:
          CLANG_PREBUILT_BIN: ${{ github.workspace }}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin

          HOSTCC: ${{ github.workspace }}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang
          HOSTCXX: ${{ github.workspace }}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang++

          HOSTAR: /usr/bin/ar
          HOSTLD: ${{ github.workspace }}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/ld.lld

          HOSTCFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          HOSTCXXFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          KBUILD_HOSTCFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          KBUILD_HOSTCXXFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

          LLVM: 1
          LLVM_IAS: 1

          OUT_DIR: ${{ github.workspace }}/gta9/out
          DIST_DIR: ${{ github.workspace }}/gta9/out

          BUILD_CONFIG: ${{ github.workspace }}/gta9/out/build.config

          LD_LIBRARY_PATH: ${{ github.workspace }}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs

        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          CLANG_DIR="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          COMPAT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs"

          export LD_LIBRARY_PATH="$COMPAT:${LD_LIBRARY_PATH:-}"

          export PATH="$TOOL_DIR:$PATH"

          export HOSTCC="$CLANG_DIR/clang"
          export HOSTCXX="$CLANG_DIR/clang++"
          export HOSTAR="/usr/bin/ar"
          export HOSTLD="$CLANG_DIR/ld.lld"

          export HOSTCFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export HOSTCXXFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          export KBUILD_HOSTCFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export KBUILD_HOSTCXXFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export OUT_DIR="$PWD/out"
          export DIST_DIR="$PWD/out"
          export BUILD_CONFIG="$PWD/out/build.config"

          echo
          echo "=================================================="
          echo "TOOLCHAIN BEFORE BUILD"
          echo "=================================================="

          echo "PATH=$PATH"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "HOSTLD=$HOSTLD"
          echo "HOSTCFLAGS=$HOSTCFLAGS"
          echo "KBUILD_HOSTCFLAGS=$KBUILD_HOSTCFLAGS"

          echo
          "$HOSTCC" --version | head -3

          echo
          "$HOSTCC" \
            --gcc-toolchain=/usr \
            -isystem /usr/include/x86_64-linux-gnu \
            -isystem /usr/include \
            -x c \
            -c /dev/null \
            -o /tmp/hostcc-test.o

          echo
          echo "HOSTCC HEADER TEST PASSED"

          echo
          "$HOSTLD" --version | head -2

          echo
          echo "=================================================="
          echo "BUILD CONFIG"
          echo "=================================================="

          test -f "$BUILD_CONFIG"

          grep -n \
            -E "^(KERNEL_DIR|CLANG_PREBUILT_BIN|MAKE_GOALS|CONFIG_MTK_PLATFORM)" \
            "$BUILD_CONFIG" \
            || true

          echo
          echo "=================================================="
          echo "START KERNEL BUILD"
          echo "=================================================="

          ./build/build.sh \
            LLVM_IAS=1 \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            KBUILD_HOSTCFLAGS="$KBUILD_HOSTCFLAGS" \
            KBUILD_HOSTCXXFLAGS="$KBUILD_HOSTCXXFLAGS" \
            -j$(($(nproc)-1))

      # ============================================================
      # 15. INSPECT BUILD OUTPUT
      # ============================================================
      - name: Inspect build outputs
        if: success()
        working-directory: gta9
        run: |
          set -eux

          echo "=== FIND KERNEL OUTPUTS ==="

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "vmlinux" \
            \) \
            -print

          echo
          echo "=== ARM64 BOOT ==="

          find out/kernel-5.10/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print \
            || true

      # ============================================================
      # 16. PACKAGE RELEASE
      # ============================================================
      - name: Package kernel
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              release/Image.gz
          fi

          if [ -f out/kernel-5.10/arch/arm64/boot/mt6789.dtb ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/mt6789.dtb \
              release/mt6789.dtb
          fi

          if [ -f out/kernel-5.10/arch/arm64/boot/mt8781_gta9_eur_open_00.dtbo ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/mt8781_gta9_eur_open_00.dtbo \
              release/mt8781_gta9_eur_open_00.dtbo
          fi

          if [ -f out/kernel-5.10/vmlinux ]; then
            cp \
              out/kernel-5.10/vmlinux \
              release/vmlinux
          fi

          echo
          echo "=== RELEASE ==="
          ls -lh release

          test -n "$(find release -type f)"

          tar -czf \
            kernel-samsung-x110-gta9.tar.gz \
            -C release \
            .

      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-samsung-x110-gta9
          path: gta9/kernel-samsung-x110-gta9.tar.gz
          if-no-files-found: error

      # ============================================================
      # 18. DEBUG ARTIFACT
      # ============================================================
      - name: Upload debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-debug
          path: |
            gta9/out/build.config
            gta9/out/kernel-5.10/.config
            gta9/out/kernel-5.10/vmlinux
            gta9/out/kernel-5.10/arch/arm64/boot/**
          if-no-files-found: ignore
