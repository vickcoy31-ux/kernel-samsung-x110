name: GTA9 X110 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            pahole \
            rsync \
            unzip \
            zip \
            lz4 \
            zstd \
            cpio \
            device-tree-compiler

      - name: Clone GTA9 Source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "=== KernelSU ==="
          ls -lah KernelSU

      - name: Verify Source
        working-directory: gta9
        run: |
          set -eux

          test -f Makefile
          test -d arch
          test -d drivers
          test -d scripts
          test -d setup
          test -f build.config.common
          test -f build.config.mtk.aarch64

          echo "=== KERNEL VERSION ==="
          make kernelversion

          echo "=== GTA9 DEFCONFIG ==="
          ls -lh arch/arm64/configs/*gta9*

          echo "=== KSU CONFIG ==="
          grep -Rni "CONFIG_KSU" \
            arch/arm64/configs \
            kernel/configs \
            2>/dev/null || true

      - name: Inspect Build Environment
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "BUILD CONFIG"
          echo "========================================"

          sed -n '1,260p' build.config.mtk.aarch64

          echo "========================================"
          echo "COMMON BUILD CONFIG"
          echo "========================================"

          sed -n '1,260p' build.config.common

          echo "========================================"
          echo "SETUP DIRECTORY"
          echo "========================================"

          ls -lah setup

          echo "========================================"
          echo "BUILD DIRECTORY"
          echo "========================================"

          ls -lah build 2>/dev/null || true

          echo "========================================"
          echo "BUILD SCRIPT"
          echo "========================================"

          if [ -f setup/build_kernel.sh ]; then
            sed -n '1,360p' setup/build_kernel.sh
          else
            echo "ERROR: setup/build_kernel.sh not found"
            exit 1
          fi

      - name: Detect Toolchains
        working-directory: gta9
        run: |
          set -eux

          echo "========================================"
          echo "SYSTEM TOOLCHAINS"
          echo "========================================"

          command -v clang || true
          command -v clang++ || true
          command -v ld.lld || true
          command -v aarch64-linux-gnu-gcc || true
          command -v arm-linux-gnueabi-gcc || true

          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          clang --version || true

          echo "========================================"
          echo "SEARCH SOURCE FOR TOOLCHAIN REFERENCES"
          echo "========================================"

          grep -RniE \
            "CLANG_PREBUILT_BIN|CLANG_VERSION|clang-r[0-9]+|proton-clang|CROSS_COMPILE|LLVM_IAS" \
            --exclude-dir=.git \
            . \
            2>/dev/null | head -200 || true

      - name: Build Kernel
        working-directory: gta9
        run: |
          set -eux

          chmod +x setup/build_kernel.sh

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
          echo "CC=${CC:-<unset>}"
          echo "CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN:-<unset>}"

          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          ./setup/build_kernel.sh --new

      - name: Find Build Outputs
        if: always()
        working-directory: gta9
        run: |
          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          if [ -d out ]; then
            find out -maxdepth 6 -type f \
              \( \
                -name "Image" \
                -o -name "Image.gz" \
                -o -name "*.dtb" \
                -o -name "*.dtbo" \
                -o -name "*.ko" \
              \) \
              -print
          else
            echo "out/ does not exist"
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: |
            gta9/out/**
          if-no-files-found: warn
