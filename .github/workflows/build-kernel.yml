      - name: Locate Build Infrastructure
        working-directory: gta9
        run: |
          set -eux

          echo "=== ALL BUILD.SH ==="
          find .. -type f -name "build.sh" -print

          echo "=== ALL KERNEL-5.10 REFERENCES ==="
          grep -Rni \
            --exclude-dir=.git \
            "kernel-5.10" \
            . 2>/dev/null | head -200 || true

          echo "=== ALL BUILD.SH REFERENCES ==="
          grep -Rni \
            --exclude-dir=.git \
            "build/build.sh" \
            . 2>/dev/null | head -200 || true

          echo "=== BUILD FILES ==="
          find . -maxdepth 4 -type f \
            \( \
              -name "build.sh" \
              -o -name "build.config*" \
              -o -name "*build*" \
            \) \
            -print | head -300

          echo "=== ROOT ==="
          ls -lah

          echo "=== SETUP ==="
          find setup -maxdepth 3 -type f -print
