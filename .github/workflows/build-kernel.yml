name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 2. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone Kernel Source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "===== KERNEL SOURCE ====="
          pwd
          git rev-parse --short HEAD

          echo "===== SOURCE ROOT ====="
          ls -la

      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "===== KERNELSU ====="
          git -C KernelSU rev-parse HEAD
          ls -la KernelSU

          echo "===== KSU CONFIG ====="
          grep -R "CONFIG_KSU" -n kernel/configs || true

      # ============================================================
      # 4. PREPARE COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare Build Layout
        working-directory: gta9
        run: |
          set -eux

          # The upstream repository itself is the kernel tree.
          #
          # The supplied build infrastructure expects:
          #
          #   kernel-5.10 -> kernel source root
          #   build       -> setup/kernel/build

          ln -s . kernel-5.10
          ln -s setup/kernel/build build

          echo "===== KERNEL LINK ====="
          ls -ld kernel-5.10

          echo "===== BUILD LINK ====="
          ls -ld build

          echo "===== BUILD SCRIPT ====="
          test -f build/build.sh
          ls -lh build/build.sh

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang
        working-directory: gta9
        run: |
          set -eux

          mkdir -p \
            prebuilts-master/clang/host/linux-x86/clang-r416183b

          wget -q --show-progress \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz \
            -O /tmp/clang-r416183b.tar.gz

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C prebuilts-master/clang/host/linux-x86/clang-r416183b

          echo "===== CLANG CHECK ====="

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang

          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang \
            --version

      # ============================================================
      # 6. CONVERT PYTHON2 GENERATOR TO PYTHON3
      # ============================================================
      - name: Convert Build Config Generator
        working-directory: gta9
        run: |
          set -eux

          echo "===== GENERATOR BEFORE CONVERSION ====="
          head -40 scripts/gen_build_config.py

          python3 -m lib2to3 -w scripts/gen_build_config.py

          echo "===== GENERATOR AFTER CONVERSION ====="
          head -40 scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

      # ============================================================
      # 7. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate Build Config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          # kernel-5.10 is a symlink to the repository root.
          # Therefore the generated config must be written to:
          #
          #   gta9/out/build.config
          #
          # and NOT ../out/build.config.

          cd kernel-5.10

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          cd ..

          echo "===== GENERATED BUILD CONFIG ====="

          test -f out/build.config

          cat out/build.config

      # ============================================================
      # 8. PATCH CLANG PATH
      # ============================================================
      - name: Patch Generated Toolchain Path
        working-directory: gta9
        run: |
          set -eux

          test -f out/build.config

          CLANG_PATH="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "===== BUILD CONFIG BEFORE PATCH ====="

          grep -n \
            "KERNEL_DIR\|KERNEL_DEFCONFIG_FILE\|BUILD_CONFIG_FRAGMENTS\|CLANG_PREBUILT_BIN" \
            out/build.config || true

          if grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then

            sed -i \
              "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_PATH}#" \
              out/build.config

          else

            echo "CLANG_PREBUILT_BIN=${CLANG_PATH}" \
              >> out/build.config

          fi

          echo "===== FINAL BUILD CONFIG ====="

          cat out/build.config

      # ============================================================
      # 9. VERIFY BUILD ENVIRONMENT
      # ============================================================
      - name: Verify Build Environment
        working-directory: gta9
        run: |
          set -eux

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== BUILD CONFIG ====="

          test -f out/build.config

          ls -lh out/build.config

          echo "===== BUILD SCRIPT ====="

          test -f build/build.sh

          ls -lh build/build.sh

          echo "===== KERNEL TREE ====="

          test -f Makefile
          test -d arch
          test -d drivers
          test -d scripts

          echo "===== DEFCONFIG ====="

          test -f \
            arch/arm64/configs/gta9_00_defconfig

          echo "===== DEVICE TREE ====="

          test -f \
            arch/arm64/boot/dts/samsung/mt8781_gta9wifi_eur_open_00.dts

          echo "===== KERNELSU ====="

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig

          echo "===== CLANG ====="

          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang \
            --version

          echo "===== CROSS COMPILER ====="

          aarch64-linux-gnu-gcc --version | head -1

      # ============================================================
      # 10. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        working-directory: gta9
        run: |
          set -eux

          export ARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export OUT_DIR="${GITHUB_WORKSPACE}/gta9/out"
          export DIST_DIR="${GITHUB_WORKSPACE}/gta9/out"

          # IMPORTANT:
          # build/build.sh expects BUILD_CONFIG relative
          # to the kernel repository ROOT_DIR.
          export BUILD_CONFIG="out/build.config"

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "PREPARING BUILD COMMAND PATH"
          echo "========================================"

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          mkdir -p "${BUILD_TOOLS_DIR}"

          # --------------------------------------------------------
          # build.sh replaces PATH with its own Android build PATH.
          #
          # Make standard Ubuntu host commands available inside
          # that PATH.
          # --------------------------------------------------------

          for cmd in \
            nproc \
            readlink \
            rm \
            mkdir \
            cp \
            mv \
            ln \
            cat \
            chmod \
            dirname \
            basename \
            grep \
            sed \
            awk \
            find \
            sort \
            cut \
            tr \
            head \
            tail \
            touch \
            stat \
            printf \
            pwd \
            realpath \
            which \
            env \
            tee \
            xargs \
            expr \
            date \
            sleep
          do

            if [ -x "/usr/bin/${cmd}" ]; then

              ln -sf \
                "/usr/bin/${cmd}" \
                "${BUILD_TOOLS_DIR}/${cmd}"

            elif [ -x "/bin/${cmd}" ]; then

              ln -sf \
                "/bin/${cmd}" \
                "${BUILD_TOOLS_DIR}/${cmd}"

            else

              echo "WARNING: /usr/bin/${cmd} and /bin/${cmd} not found"

            fi

          done

          echo "===== BUILD COMMANDS ====="

          ls -la "${BUILD_TOOLS_DIR}"

          echo "========================================"
          echo "STARTING KERNEL BUILD"
          echo "========================================"

          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}"

          echo "===== BUILD CONFIG CHECK ====="

          test -f "${BUILD_CONFIG}"

          grep -n \
            "KERNEL_DIR\|KERNEL_DEFCONFIG_FILE\|BUILD_CONFIG_FRAGMENTS\|CLANG_PREBUILT_BIN" \
            "${BUILD_CONFIG}"

          echo "========================================"
          echo "RUNNING build/build.sh"
          echo "========================================"

          ./build/build.sh \
            LLVM_IAS=1 \
            -j"$(nproc)"

      # ============================================================
      # 11. INSPECT BUILD OUTPUT
      # ============================================================
      - name: Inspect Build Output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "OUT DIRECTORY"
          echo "========================================"

          find out \
            -maxdepth 6 \
            -type f \
            -printf '%p %k KB\n' \
            2>/dev/null | sort || true

          echo "========================================"
          echo "KERNEL IMAGES"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print \
            2>/dev/null | sort || true

          echo "========================================"
          echo "VMLINUX"
          echo "========================================"

          find . \
            -type f \
            -name "vmlinux" \
            -print \
            2>/dev/null | sort || true

      # ============================================================
      # 12. PREPARE RELEASE ARTIFACTS
      # ============================================================
      - name: Prepare Artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          echo "===== SEARCHING KERNEL OUTPUT ====="

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print

          # --------------------------------------------------------
          # Kernel Image
          # --------------------------------------------------------

          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              release/Image.gz

          elif [ -f out/kernel-5.10/arch/arm64/boot/Image ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/Image \
              release/Image

          fi

          # --------------------------------------------------------
          # DTB
          # --------------------------------------------------------

          if [ -f out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt6789.dtb ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt6789.dtb \
              release/mt6789.dtb

          fi

          # --------------------------------------------------------
          # Galaxy Tab A9 EUR DTBO
          # --------------------------------------------------------

          if [ -f out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtbo ]; then

            cp \
              out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtbo \
              release/mt8781_gta9_eur_open_00.dtbo

          fi

          echo "===== RELEASE FILES ====="

          ls -lah release

          test "$(find release -type f | wc -l)" -gt 0

      # ============================================================
      # 13. UPLOAD KERNEL ARTIFACTS
      # ============================================================
      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-a9-x110-kernel
          path: gta9/release/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 14. UPLOAD FULL BUILD OUTPUT
      # ============================================================
      - name: Upload Build Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-a9-x110-build-output
          path: gta9/out/
          if-no-files-found: warn
          retention-days: 7
