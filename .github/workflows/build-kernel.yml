name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            device-tree-compiler

          echo "========================================"
          echo "HOST TOOLCHAIN"
          echo "========================================"

          /usr/bin/gcc --version | head -1
          /usr/bin/g++ --version | head -1
          /usr/bin/make --version | head -1
          /usr/bin/uname -a

      # ============================================================
      # 2. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone Kernel Source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "========================================"
          echo "KERNEL SOURCE"
          echo "========================================"

          pwd
          git rev-parse --short HEAD
          ls -la

      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "========================================"
          echo "KERNELSU"
          echo "========================================"

          git -C KernelSU rev-parse HEAD

          test -f KernelSU/kernel/Kconfig

          echo "========================================"
          echo "KSU CONFIG"
          echo "========================================"

          grep -R "CONFIG_KSU" -n kernel/configs || true

      # ============================================================
      # 4. PREPARE COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare Build Layout
        working-directory: gta9
        run: |
          set -eux

          ln -s . kernel-5.10
          ln -s setup/kernel/build build

          echo "========================================"
          echo "LAYOUT"
          echo "========================================"

          ls -ld kernel-5.10
          ls -ld build

          test -f build/build.sh

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang
        working-directory: gta9
        run: |
          set -eux

          mkdir -p \
            prebuilts-master/clang/host/linux-x86/clang-r416183b

          wget -q --show-progress \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz \
            -O /tmp/clang-r416183b.tar.gz

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C prebuilts-master/clang/host/linux-x86/clang-r416183b

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          test -x \
            prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang

          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang \
            --version

      # ============================================================
      # 6. CONVERT PYTHON2 GENERATOR
      # ============================================================
      - name: Convert Build Config Generator
        working-directory: gta9
        run: |
          set -eux

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

      # ============================================================
      # 7. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate Build Config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          cd kernel-5.10

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          cd ..

          test -f out/build.config

          echo "========================================"
          echo "BUILD CONFIG"
          echo "========================================"

          cat out/build.config

      # ============================================================
      # 8. PATCH CLANG PATH
      # ============================================================
      - name: Patch Generated Toolchain Path
        working-directory: gta9
        run: |
          set -eux

          CLANG_PATH="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          if grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            sed -i \
              "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_PATH}#" \
              out/build.config
          else
            echo "CLANG_PREBUILT_BIN=${CLANG_PATH}" \
              >> out/build.config
          fi

          echo "========================================"
          echo "CLANG PATH"
          echo "========================================"

          grep "CLANG_PREBUILT_BIN" out/build.config

      # ============================================================
      # 9. VERIFY SOURCE AND HOST GCC
      # ============================================================
      - name: Verify Build Environment
        working-directory: gta9
        run: |
          set -eux

          test -f Makefile
          test -d arch
          test -d drivers
          test -d scripts

          test -f \
            arch/arm64/configs/gta9_00_defconfig

          test -f \
            arch/arm64/boot/dts/samsung/mt8781_gta9wifi_eur_open_00.dts

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig

          test -f out/build.config

          echo "========================================"
          echo "KSU"
          echo "========================================"

          grep -n CONFIG_KSU kernel/configs/ot11.config

          echo "========================================"
          echo "HOST GCC"
          echo "========================================"

          /usr/bin/gcc --version | head -1

          echo "========================================"
          echo "HOST GCC INCLUDE PATH"
          echo "========================================"

          echo | /usr/bin/gcc -v -E - 2>&1 \
            | sed -n \
              '/#include <...> search starts here:/,/End of search list./p'

          echo "========================================"
          echo "HOST GCC TEST"
          echo "========================================"

          cat > /tmp/host-test.c <<'EOF'
          #include <sys/types.h>
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              printf("host compiler OK\n");
              return 0;
          }
          EOF

          /usr/bin/gcc \
            /tmp/host-test.c \
            -o /tmp/host-test

          /tmp/host-test

          echo "========================================"
          echo "UNAME"
          echo "========================================"

          /usr/bin/uname -a

      # ============================================================
      # 10. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        working-directory: gta9
        run: |
          set -eux

          # --------------------------------------------------------
          # TARGET TOOLCHAIN
          # --------------------------------------------------------

          export ARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          export LLVM=1
          export LLVM_IAS=1

          export OUT_DIR="${GITHUB_WORKSPACE}/gta9/out"
          export DIST_DIR="${GITHUB_WORKSPACE}/gta9/out"

          export BUILD_CONFIG="out/build.config"

          # --------------------------------------------------------
          # HOST TOOLCHAIN
          # --------------------------------------------------------

          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTAR=/usr/bin/ar
          export HOSTLD=/usr/bin/ld

          # IMPORTANT:
          # Do NOT force -I/usr/include here.
          # GCC automatically handles Ubuntu multiarch headers.
          unset HOSTCFLAGS || true
          unset HOSTCXXFLAGS || true

          echo "========================================"
          echo "HOST COMPILER"
          echo "========================================"

          echo "HOSTCC=${HOSTCC}"
          echo "HOSTCXX=${HOSTCXX}"
          echo "HOSTAR=${HOSTAR}"
          echo "HOSTLD=${HOSTLD}"

          "${HOSTCC}" --version | head -1
          "${HOSTCXX}" --version | head -1

          # --------------------------------------------------------
          # BUILD.SH INTERNAL PATH
          # --------------------------------------------------------

          echo "========================================"
          echo "PREPARING BUILD TOOLS"
          echo "========================================"

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          mkdir -p "${BUILD_TOOLS_DIR}"

          for cmd in \
            uname \
            nproc \
            readlink \
            rm \
            mkdir \
            cp \
            mv \
            ln \
            make \
            gcc \
            g++ \
            ld \
            ar \
            as \
            objcopy \
            objdump \
            strip \
            ranlib \
            nm \
            addr2line \
            strings \
            c++filt \
            cat \
            chmod \
            chown \
            dirname \
            basename \
            grep \
            egrep \
            fgrep \
            sed \
            awk \
            find \
            sort \
            uniq \
            cut \
            tr \
            head \
            tail \
            touch \
            stat \
            printf \
            pwd \
            realpath \
            which \
            env \
            tee \
            xargs \
            expr \
            date \
            sleep \
            diff \
            cmp \
            du \
            df \
            tar \
            gzip \
            gunzip \
            xz \
            unzip \
            zip \
            rsync \
            git \
            perl \
            python3 \
            bc \
            flex \
            bison \
            dtc \
            file
          do
            if [ -x "/usr/bin/${cmd}" ]; then
              ln -sf \
                "/usr/bin/${cmd}" \
                "${BUILD_TOOLS_DIR}/${cmd}"
            elif [ -x "/bin/${cmd}" ]; then
              ln -sf \
                "/bin/${cmd}" \
                "${BUILD_TOOLS_DIR}/${cmd}"
            else
              echo "WARNING: ${cmd} not found"
            fi
          done

          echo "========================================"
          echo "INTERNAL TOOL CHECK"
          echo "========================================"

          test -x "${BUILD_TOOLS_DIR}/uname"
          test -x "${BUILD_TOOLS_DIR}/make"
          test -x "${BUILD_TOOLS_DIR}/gcc"
          test -x "${BUILD_TOOLS_DIR}/mkdir"

          "${BUILD_TOOLS_DIR}/uname" -a
          "${BUILD_TOOLS_DIR}/make" --version | head -1
          "${BUILD_TOOLS_DIR}/gcc" --version | head -1

          echo "========================================"
          echo "BUILD CONFIG CHECK"
          echo "========================================"

          test -f "${BUILD_CONFIG}"

          grep -n \
            "KERNEL_DIR\|KERNEL_DEFCONFIG_FILE\|BUILD_CONFIG_FRAGMENTS\|CLANG_PREBUILT_BIN" \
            "${BUILD_CONFIG}"

          echo "========================================"
          echo "STARTING KERNEL BUILD"
          echo "========================================"

          ./build/build.sh \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTAR=/usr/bin/ar \
            HOSTLD=/usr/bin/ld \
            LLVM_IAS=1 \
            -j"$(nproc)"

      # ============================================================
      # 11. INSPECT OUTPUT
      # ============================================================
      - name: Inspect Build Output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "OUT DIRECTORY"
          echo "========================================"

          find out \
            -maxdepth 6 \
            -type f \
            -printf '%p %k KB\n' \
            2>/dev/null \
            | sort || true

          echo "========================================"
          echo "KERNEL IMAGES"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo "========================================"
          echo "VMLINUX"
          echo "========================================"

          find . \
            -type f \
            -name "vmlinux" \
            -print \
            2>/dev/null \
            | sort || true

      # ============================================================
      # 12. PREPARE RELEASE
      # ============================================================
      - name: Prepare Artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          echo "========================================"
          echo "SEARCHING OUTPUT"
          echo "========================================"

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print

          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              release/Image.gz
          elif [ -f out/kernel-5.10/arch/arm64/boot/Image ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/Image \
              release/Image
          fi

          if [ -f out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt6789.dtb ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt6789.dtb \
              release/mt6789.dtb
          fi

          if [ -f out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtbo ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtbo \
              release/mt8781_gta9_eur_open_00.dtbo
          fi

          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          ls -lah release

          test "$(find release -type f | wc -l)" -gt 0

      # ============================================================
      # 13. UPLOAD SUCCESSFUL KERNEL
      # ============================================================
      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-a9-x110-kernel
          path: gta9/release/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 14. UPLOAD SMALL DEBUG FILES ONLY ON FAILURE
      # ============================================================
      - name: Upload Debug Config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-a9-x110-debug
          path: |
            gta9/out/build.config
            gta9/out/build.config.gki.aarch64
            gta9/out/build.config.mtk
            gta9/out/gta9_00.config
          if-no-files-found: warn
          retention-days: 3
