name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      # ============================================================
      # 1. HOST DEPENDENCIES
      # ============================================================
      - name: Install host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-dev \
            python3-lib2to3 \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            cpio \
            rsync \
            zip \
            unzip \
            tar \
            gzip \
            xz-utils \
            zstd \
            file \
            patch \
            perl \
            sed \
            grep \
            gawk \
            diffutils \
            findutils \
            coreutils \
            binutils \
            libc6-dev \
            libxml2 \
            libxml2-dev \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler

          echo "=== HOST GCC ==="
          gcc --version

          echo
          echo "=== HOST MAKE ==="
          make --version

          echo
          echo "=== HOST PYTHON ==="
          python3 --version


      # ============================================================
      # 2. CLONE SOURCE
      # ============================================================
      - name: Clone Samsung GTA9 kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== SOURCE ROOT ==="
          pwd

          echo
          echo "=== SOURCE TOP LEVEL ==="
          ls -la

          echo
          echo "=== KERNEL MAKEFILE ==="
          test -f Makefile

          echo
          echo "=== DEFCONFIG ==="
          test -f arch/arm64/configs/gta9_00_defconfig


      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        run: |
          set -eux

          cd gta9

          echo "=== GIT SUBMODULES ==="

          git submodule sync --recursive

          git submodule update \
            --init \
            --depth=1

          echo
          echo "=== KERNELSU ==="

          test -d KernelSU
          test -d KernelSU/kernel

          git -C KernelSU rev-parse HEAD

          echo
          echo "=== KERNELSU CONFIG ==="

          grep -R \
            "CONFIG_KSU" \
            kernel/configs \
            arch/arm64/configs \
            2>/dev/null || true


      # ============================================================
      # 4. CREATE COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare kernel build layout
        run: |
          set -eux

          cd gta9

          if [ ! -e kernel-5.10 ]; then
            ln -s . kernel-5.10
          fi

          if [ ! -e build ]; then
            ln -s setup/kernel/build build
          fi

          echo "=== BUILD LAYOUT ==="

          ls -ld \
            kernel-5.10 \
            build

          echo
          echo "=== BUILD SCRIPT ==="

          test -f setup/kernel/build/build.sh

          chmod +x setup/kernel/build/build.sh

          echo
          echo "=== GENERATOR ==="

          test -f scripts/gen_build_config.py


      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang r416183b
        run: |
          set -eux

          cd gta9

          CLANG_BASE="prebuilts-master/clang/host/linux-x86"
          CLANG_ROOT="$CLANG_BASE/clang-r416183b"

          mkdir -p "$CLANG_BASE"

          if [ ! -x "$CLANG_ROOT/bin/clang-12" ]; then

            rm -rf "$CLANG_ROOT"

            mkdir -p "$CLANG_ROOT"

            curl -L --fail --retry 5 \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz" \
              -o /tmp/clang-r416183b.tar.gz

            tar -xzf \
              /tmp/clang-r416183b.tar.gz \
              -C "$CLANG_ROOT"

          fi

          echo "=== CLANG ROOT ==="
          echo "$CLANG_ROOT"

          echo
          echo "=== CLANG BINARY ==="

          ls -lh \
            "$CLANG_ROOT/bin/clang-12"

          test -x "$CLANG_ROOT/bin/clang-12"

          echo
          echo "=== CLANG VERSION ==="

          "$CLANG_ROOT/bin/clang-12" --version


      # ============================================================
      # 6. DETECT REAL CLANG RESOURCE DIRECTORY
      # ============================================================
      - name: Detect Clang resource directory
        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          CLANG_BIN="$CLANG_ROOT/bin"

          echo "=== CLANG ROOT ==="
          echo "$CLANG_ROOT"

          echo
          echo "=== CLANG REPORTED RESOURCE DIR ==="

          PRINTED_RESOURCE_DIR="$(
            "$CLANG_BIN/clang-12" \
              -print-resource-dir
          )"

          echo "$PRINTED_RESOURCE_DIR"

          echo
          echo "=== SEARCHING FOR stddef.h ==="

          find "$CLANG_ROOT" \
            -type f \
            -name stddef.h \
            -print

          STDDEF_HEADER="$(
            find "$CLANG_ROOT" \
              -type f \
              -name stddef.h \
              -path '*/include/stddef.h' \
              -print \
              | head -n 1
          )"

          test -n "$STDDEF_HEADER"

          echo
          echo "=== FOUND STDDEF.H ==="
          echo "$STDDEF_HEADER"

          CLANG_RESOURCE_DIR="${STDDEF_HEADER%/include/stddef.h}"

          test -d "$CLANG_RESOURCE_DIR"
          test -d "$CLANG_RESOURCE_DIR/include"

          echo
          echo "=== REAL CLANG RESOURCE DIR ==="
          echo "$CLANG_RESOURCE_DIR"

          echo
          echo "=== REQUIRED HEADERS ==="

          test -f \
            "$CLANG_RESOURCE_DIR/include/stddef.h"

          test -f \
            "$CLANG_RESOURCE_DIR/include/stdint.h"

          echo
          echo "=== RESOURCE INCLUDE ==="

          ls -la \
            "$CLANG_RESOURCE_DIR/include" \
            | head -50

          echo "CLANG_ROOT=$CLANG_ROOT" >> "$GITHUB_ENV"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "CLANG_RESOURCE_DIR=$CLANG_RESOURCE_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 7. PREPARE LLVM / LLD
      # ============================================================
      - name: Prepare LLVM tools
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          mkdir -p "$TOOL_DIR"

          echo "=== TOOL DIRECTORY ==="
          echo "$TOOL_DIR"

          echo
          echo "=== INSTALL DIRECT CLANG ==="

          rm -f "$TOOL_DIR/clang"
          rm -f "$TOOL_DIR/clang++"

          cp \
            "$CLANG_BIN/clang-12" \
            "$TOOL_DIR/clang"

          cp \
            "$CLANG_BIN/clang-12" \
            "$TOOL_DIR/clang++"

          chmod +x \
            "$TOOL_DIR/clang" \
            "$TOOL_DIR/clang++"

          echo
          echo "=== INSTALL LLD ==="

          test -f "$CLANG_BIN/lld"

          rm -f "$TOOL_DIR/lld"
          rm -f "$TOOL_DIR/ld.lld"

          cp \
            "$CLANG_BIN/lld" \
            "$TOOL_DIR/lld"

          chmod +x \
            "$TOOL_DIR/lld"

          ln -s \
            lld \
            "$TOOL_DIR/ld.lld"

          echo
          echo "=== LLVM TOOLS ==="

          ls -lh \
            "$TOOL_DIR/clang" \
            "$TOOL_DIR/clang++" \
            "$TOOL_DIR/lld" \
            "$TOOL_DIR/ld.lld"


      # ============================================================
      # 8. LLD COMPATIBILITY LIBRARY
      # ============================================================
      - name: Prepare LLD compatibility libraries
        run: |
          set -eux

          cd gta9

          # IMPORTANT:
          # Every GitHub Actions run step has its own shell.
          # Therefore TOOL_DIR is defined again here.

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          COMPAT_DIR="$CLANG_ROOT/compat-libs"

          mkdir -p "$TOOL_DIR"
          mkdir -p "$COMPAT_DIR"

          echo "=== TOOL DIR ==="
          echo "$TOOL_DIR"

          echo
          echo "=== COMPAT DIR ==="
          echo "$COMPAT_DIR"

          SYSTEM_LIBXML="$(
            ldconfig -p \
              | grep 'libxml2.so.2 ' \
              | head -n 1 \
              | sed 's/.*=> //'
          )"

          test -n "$SYSTEM_LIBXML"
          test -f "$SYSTEM_LIBXML"

          echo
          echo "=== SYSTEM LIBXML ==="
          echo "$SYSTEM_LIBXML"

          ln -sf \
            "$SYSTEM_LIBXML" \
            "$COMPAT_DIR/libxml2.so.2.9.10"

          echo
          echo "=== COMPAT LIB ==="

          ls -l \
            "$COMPAT_DIR/libxml2.so.2.9.10"

          echo
          echo "=== LLD BINARY ==="

          test -x "$TOOL_DIR/lld"

          ls -lh "$TOOL_DIR/lld"

          echo
          echo "=== TEST LLD ==="

          export LD_LIBRARY_PATH="$COMPAT_DIR:${LD_LIBRARY_PATH:-}"

          "$TOOL_DIR/lld" --version


      # ============================================================
      # 9. PREPARE ANDROID BUILD HOST PATH
      # ============================================================
      - name: Prepare Android build host command path
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          mkdir -p "$TOOL_DIR"

          HOST_COMMANDS="
            ar
            as
            awk
            basename
            bash
            cat
            chmod
            chown
            cmp
            cp
            cut
            date
            diff
            dirname
            du
            echo
            env
            expr
            find
            grep
            head
            hostname
            id
            install
            ln
            ls
            mkdir
            mktemp
            mv
            nproc
            od
            paste
            perl
            printf
            pwd
            readlink
            realpath
            rm
            rmdir
            sed
            sort
            stat
            tail
            tar
            tee
            test
            touch
            tr
            uname
            uniq
            wc
            which
            xargs
            yes
          "

          for cmd in $HOST_COMMANDS; do
            target="$(type -P "$cmd" || true)"

            if [ -n "$target" ] && [ -x "$target" ]; then
              rm -f "$TOOL_DIR/$cmd"
              ln -s "$target" "$TOOL_DIR/$cmd"
            fi
          done

          echo
          echo "=== IMPORTANT HOST COMMANDS ==="

          for cmd in \
            echo \
            pwd \
            expr \
            xargs \
            uname \
            nproc \
            rm \
            mkdir \
            readlink \
            realpath
          do
            echo "--- $cmd ---"
            ls -l "$TOOL_DIR/$cmd" || true
          done


      # ============================================================
      # 10. PREPARE MAKE / BINUTILS
      # ============================================================
      - name: Prepare kernel build tools
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          for cmd in \
            make \
            gcc \
            g++ \
            ld \
            objcopy \
            objdump \
            nm \
            strip \
            ranlib \
            readelf \
            strings
          do
            target="$(type -P "$cmd" || true)"

            if [ -n "$target" ] && [ -x "$target" ]; then
              rm -f "$TOOL_DIR/$cmd"
              ln -s "$target" "$TOOL_DIR/$cmd"
            fi
          done

          echo
          echo "=== MAKE ==="

          "$TOOL_DIR/make" --version | head -2


      # ============================================================
      # 11. CONVERT PYTHON2 GENERATOR
      # ============================================================
      - name: Prepare build config generator
        run: |
          set -eux

          cd gta9

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

          echo
          echo "=== GENERATOR READY ==="


      # ============================================================
      # 12. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate kernel build config
        run: |
          set -eux

          cd gta9

          rm -rf out

          mkdir -p out

          python3 \
            scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          test -f out/build.config

          echo
          echo "=== GENERATED BUILD CONFIG ==="

          sed -n '1,240p' out/build.config


      # ============================================================
      # 13. PATCH GENERATED CLANG PATH
      # ============================================================
      - name: Configure Android Clang
        run: |
          set -eux

          cd gta9

          test -f out/build.config

          sed -i \
            "s|^CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=$CLANG_BIN|" \
            out/build.config

          if ! grep -q '^CLANG_PREBUILT_BIN=' out/build.config; then
            echo "CLANG_PREBUILT_BIN=$CLANG_BIN" \
              >> out/build.config
          fi

          echo
          echo "=== CLANG CONFIG ==="

          grep -n \
            'CLANG_PREBUILT_BIN' \
            out/build.config


      # ============================================================
      # 14. VERIFY INTERNAL CLANG
      # ============================================================
      - name: Verify internal Android Clang
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          HOST_CFLAGS="--gcc-toolchain=/usr \
          -resource-dir=$CLANG_RESOURCE_DIR \
          -isystem /usr/include/x86_64-linux-gnu \
          -isystem /usr/include"

          echo "=== INTERNAL CLANG VERSION ==="

          "$TOOL_DIR/clang" --version

          echo
          echo "=== INTERNAL CLANG++ VERSION ==="

          "$TOOL_DIR/clang++" --version

          echo
          echo "=== INTERNAL CLANG RESOURCE DIR ==="

          "$TOOL_DIR/clang" \
            $HOST_CFLAGS \
            -print-resource-dir

          echo
          echo "=== EXPECTED RESOURCE DIR ==="

          echo "$CLANG_RESOURCE_DIR"

          echo
          echo "=== STDDEF.H ==="

          test -f \
            "$CLANG_RESOURCE_DIR/include/stddef.h"

          ls -l \
            "$CLANG_RESOURCE_DIR/include/stddef.h"

          echo
          echo "=== INTERNAL CLANG HEADER COMPILE ==="

          cat > /tmp/internal-clang-header-test.c <<'EOF'
          #include <stddef.h>
          #include <stdint.h>

          int main(void)
          {
              size_t x = 0;
              uint32_t y = 0;
              return (int)(x + y);
          }
          EOF

          "$TOOL_DIR/clang" \
            $HOST_CFLAGS \
            -x c \
            -c \
            /tmp/internal-clang-header-test.c \
            -o /tmp/internal-clang-header-test.o

          test -f \
            /tmp/internal-clang-header-test.o

          echo
          echo "=== INTERNAL CLANG HEADER TEST PASSED ==="


      # ============================================================
      # 15. VERIFY HOST TOOLCHAIN
      # ============================================================
      - name: Verify host toolchain
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          echo "=== HOST GCC ==="

          gcc --version | head -1

          echo
          echo "=== HOST HEADER COMPILE ==="

          cat > /tmp/gcc-host-test.c <<'EOF'
          #include <sys/types.h>
          #include <stddef.h>
          #include <stdint.h>

          int main(void)
          {
              size_t x = 0;
              uint32_t y = 0;
              return (int)(x + y);
          }
          EOF

          gcc \
            -c \
            /tmp/gcc-host-test.c \
            -o /tmp/gcc-host-test.o

          test -f \
            /tmp/gcc-host-test.o

          echo
          echo "=== MAKE TEST ==="

          "$TOOL_DIR/make" --version | head -1

          echo
          echo "=== UNAME TEST ==="

          "$TOOL_DIR/uname" -a

          echo
          echo "=== NPROC TEST ==="

          "$TOOL_DIR/nproc"


      # ============================================================
      # 16. VERIFY KERNELSU
      # ============================================================
      - name: Verify KernelSU and kernel configuration
        run: |
          set -eux

          cd gta9

          echo "=== KERNELSU ==="

          test -d KernelSU
          test -d KernelSU/kernel

          echo
          echo "KernelSU commit:"

          git -C KernelSU rev-parse HEAD

          echo
          echo "=== KSU CONFIG ==="

          grep -R \
            "CONFIG_KSU=y" \
            kernel/configs \
            arch/arm64/configs \
            2>/dev/null

          echo
          echo "=== DEFCONFIG ==="

          test -f \
            arch/arm64/configs/gta9_00_defconfig

          echo
          echo "=== DTS ==="

          test -f \
            arch/arm64/boot/dts/samsung/mt8781_gta9wifi_eur_open_00.dts

          echo
          echo "=== OT11 CONFIGS ==="

          test -f kernel/configs/ot11.config
          test -f kernel/configs/ot11_wifi.config
          test -f kernel/configs/ot11_data.config


      # ============================================================
      # 17. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          OUT_DIR: out
          DIST_DIR: out
          BUILD_CONFIG: out/build.config
          HOSTCC: ${{ github.workspace }}/gta9/build/build-tools/path/linux-x86/clang
          HOSTCXX: ${{ github.workspace }}/gta9/build/build-tools/path/linux-x86/clang++
          HOSTAR: /usr/bin/ar
          HOSTLD: ${{ github.workspace }}/gta9/build/build-tools/path/linux-x86/ld.lld
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          export PATH="$TOOL_DIR:$PATH"

          export LD_LIBRARY_PATH="$CLANG_ROOT/compat-libs:${LD_LIBRARY_PATH:-}"

          export HOSTCFLAGS="--gcc-toolchain=/usr \
          -resource-dir=$CLANG_RESOURCE_DIR \
          -isystem /usr/include/x86_64-linux-gnu \
          -isystem /usr/include"

          export HOSTCXXFLAGS="$HOSTCFLAGS"

          export HOSTLDFLAGS="--gcc-toolchain=/usr"

          echo "============================================================"
          echo "START KERNEL BUILD"
          echo "============================================================"

          echo
          echo "=== BUILD CONFIG ==="

          test -f out/build.config

          realpath out/build.config

          echo
          echo "=== CLANG ==="

          "$TOOL_DIR/clang" --version

          echo
          echo "=== CLANG RESOURCE ==="

          echo "$CLANG_RESOURCE_DIR"

          test -f \
            "$CLANG_RESOURCE_DIR/include/stddef.h"

          echo
          echo "=== HOSTCC ==="

          "$HOSTCC" --version

          echo
          echo "=== HOSTLD ==="

          "$HOSTLD" --version

          echo
          echo "=== BUILD ENV ==="

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
          echo "OUT_DIR=$OUT_DIR"
          echo "DIST_DIR=$DIST_DIR"
          echo "BUILD_CONFIG=$BUILD_CONFIG"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "HOSTLD=$HOSTLD"
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          echo
          echo "============================================================"
          echo "RUNNING AOSP KERNEL BUILD"
          echo "============================================================"

          ./build/build.sh \
            LLVM_IAS=1 \
            -j"$(($(nproc)-1))"

          echo
          echo "============================================================"
          echo "KERNEL BUILD FINISHED"
          echo "============================================================"


      # ============================================================
      # 18. LOCATE OUTPUTS
      # ============================================================
      - name: Locate kernel outputs
        if: success()
        run: |
          set -eux

          cd gta9

          echo "=== SEARCHING OUTPUTS ==="

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "vmlinux" \
            \) \
            -print


      # ============================================================
      # 19. PACKAGE
      # ============================================================
      - name: Package kernel
        if: success()
        run: |
          set -eux

          cd gta9

          mkdir -p release

          BOOT_DIR="out/kernel-5.10/arch/arm64/boot"

          echo "=== BOOT DIRECTORY ==="

          test -d "$BOOT_DIR"

          ls -lah "$BOOT_DIR"

          echo
          echo "=== IMAGE.GZ ==="

          test -f "$BOOT_DIR/Image.gz"

          cp \
            "$BOOT_DIR/Image.gz" \
            release/Image.gz

          echo
          echo "=== MT6789 DTB ==="

          DTB="$(
            find "$BOOT_DIR" \
              -type f \
              -name "mt6789.dtb" \
              | head -n 1
          )"

          test -n "$DTB"

          cp \
            "$DTB" \
            release/mt6789.dtb

          echo
          echo "=== GTA9 EUR DTBO ==="

          DTBO="$(
            find "$BOOT_DIR" \
              -type f \
              -name "mt8781_gta9_eur_open_00.dtbo" \
              | head -n 1
          )"

          test -n "$DTBO"

          cp \
            "$DTBO" \
            release/mt8781_gta9_eur_open_00.dtbo

          echo
          echo "=== VMLINUX ==="

          VMLINUX="$(
            find out \
              -type f \
              -name vmlinux \
              | head -n 1
          )"

          test -n "$VMLINUX"

          cp \
            "$VMLINUX" \
            release/vmlinux

          echo
          echo "=== RELEASE ==="

          ls -lh release

          echo
          echo "=== CREATE TAR ==="

          tar -czf \
            kernel-samsung-x110-gta9.tar.gz \
            -C release \
            .

          ls -lh \
            kernel-samsung-x110-gta9.tar.gz


      # ============================================================
      # 20. UPLOAD SUCCESS ARTIFACT
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-samsung-x110-gta9
          path: gta9/kernel-samsung-x110-gta9.tar.gz
          if-no-files-found: error


      # ============================================================
      # 21. DEBUG ON FAILURE
      # ============================================================
      - name: Collect debug information
        if: failure()
        run: |
          set +e

          cd gta9

          echo "============================================================"
          echo "BUILD FAILED - DEBUG INFORMATION"
          echo "============================================================"

          echo
          echo "=== PWD ==="
          pwd

          echo
          echo "=== TOP LEVEL ==="
          ls -la

          echo
          echo "=== OUT ==="
          ls -lah out 2>/dev/null || true

          echo
          echo "=== BUILD CONFIG ==="
          sed -n '1,280p' \
            out/build.config \
            2>/dev/null || true

          echo
          echo "=== CLANG ==="

          "$PWD/build/build-tools/path/linux-x86/clang" \
            --version \
            2>/dev/null || true

          echo
          echo "=== CLANG RESOURCE ==="

          echo "${CLANG_RESOURCE_DIR:-UNSET}"

          echo
          echo "=== STDDEF.H ==="

          find "$CLANG_ROOT" \
            -type f \
            -name stddef.h \
            -print \
            2>/dev/null || true

          echo
          echo "=== KERNELSU ==="

          git -C KernelSU \
            rev-parse HEAD \
            2>/dev/null || true

          echo
          echo "=== KSU CONFIG ==="

          grep -R \
            "CONFIG_KSU" \
            kernel/configs \
            arch/arm64/configs \
            2>/dev/null || true

          echo
          echo "=== OUTPUTS ==="

          find out \
            -type f \
            \( \
              -name "*.log" \
              -o -name "Image*" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "vmlinux" \
            \) \
            -print \
            2>/dev/null || true


      # ============================================================
      # 22. UPLOAD DEBUG ARTIFACT
      # ============================================================
      - name: Upload debug artifact
