name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            gzip \
            xz-utils \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            libc6-dev \
            libssl-dev \
            libelf-dev \
            libxml2 \
            libxml2-dev \
            python3 \
            python3-pip \
            cpio \
            rsync \
            file \
            ca-certificates

      # ============================================================
      # 2. CLONE SOURCE
      # ============================================================
      - name: Clone Samsung GTA9 kernel
        run: |
          set -eux

          git clone --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== SOURCE ROOT ==="
          pwd

          test -f Makefile
          test -d arch
          test -d drivers
          test -f build.config.mtk.aarch64

          echo "Kernel source OK"

      # ============================================================
      # 3. KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          test -d KernelSU
          test -d KernelSU/kernel

          echo "=== KERNELSU COMMIT ==="
          git -C KernelSU rev-parse HEAD

          echo
          echo "=== KSU CONFIG ==="
          grep -R "^CONFIG_KSU=" kernel/configs || true

      # ============================================================
      # 4. COMPATIBILITY LAYOUT
      # ============================================================
      - name: Prepare Android kernel build layout
        working-directory: gta9
        run: |
          set -eux

          rm -rf kernel-5.10
          ln -s . kernel-5.10

          rm -f build
          ln -s setup/kernel/build build

          echo "=== LAYOUT ==="
          ls -la

          echo
          echo "kernel-5.10:"
          readlink -f kernel-5.10

          echo
          echo "build:"
          readlink -f build

          test -f kernel-5.10/Makefile
          test -f build/build.sh

      # ============================================================
      # 5. DOWNLOAD CLANG R416183B
      # ============================================================
      - name: Download Android Clang r416183b
        working-directory: gta9
        run: |
          set -eux

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"

          mkdir -p "$CLANG_ROOT"

          cd "$CLANG_ROOT"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          echo "=== VERIFY ARCHIVE ==="

          ls -lh clang.tar.gz

          gzip -t clang.tar.gz

          echo "Archive OK"

          tar -xzf clang.tar.gz

          rm -f clang.tar.gz

          echo
          echo "=== CLANG DIRECTORY ==="

          ls -la bin | head -50

      # ============================================================
      # 6. VERIFY REAL CLANG
      # ============================================================
      - name: Verify Android Clang
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "=== CLANG FILES ==="

          ls -l \
            "$CLANG_BIN/clang" \
            "$CLANG_BIN/clang.real" \
            "$CLANG_BIN/clang-12" \
            "$CLANG_BIN/clang++" \
            "$CLANG_BIN/clang++.real" \
            || true

          echo
          echo "=== DIRECT CLANG-12 ==="

          test -x "$CLANG_BIN/clang-12"

          "$CLANG_BIN/clang-12" --version

          echo
          echo "=== DIRECT CLANG-12 TEST ==="

          "$CLANG_BIN/clang-12" \
            --gcc-toolchain=/usr \
            -isystem /usr/include/x86_64-linux-gnu \
            -isystem /usr/include \
            -x c \
            -c /dev/null \
            -o /tmp/clang12-test.o

          echo "Direct clang-12 test PASSED"

      # ============================================================
      # 7. LIBXML2 COMPATIBILITY
      # ============================================================
      - name: Prepare Clang runtime libraries
        working-directory: gta9
        run: |
          set -eux

          COMPAT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs"

          mkdir -p "$COMPAT"

          SYSTEM_XML="$(find /usr/lib/x86_64-linux-gnu \
            -maxdepth 1 \
            -type f \
            -name 'libxml2.so.2*' \
            | head -n 1)"

          test -n "$SYSTEM_XML"

          ln -sf "$SYSTEM_XML" "$COMPAT/libxml2.so.2.9.10"

          echo "=== LIBXML2 COMPAT ==="
          ls -l "$COMPAT/libxml2.so.2.9.10"

      # ============================================================
      # 8. PYTHON BUILD GENERATOR
      # ============================================================
      - name: Prepare build scripts
        working-directory: gta9
        run: |
          set -eux

          python3 -m lib2to3 -w scripts/gen_build_config.py

          python3 -m py_compile scripts/gen_build_config.py

          echo "Build generator OK"

      # ============================================================
      # 9. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate build config
        working-directory: gta9
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          test -f out/build.config

          echo
          echo "=== BUILD CONFIG ==="

          grep -n \
            -E "^(KERNEL_DIR|CLANG_PREBUILT_BIN|MAKE_GOALS|CONFIG_MTK_PLATFORM)" \
            out/build.config \
            || true

      # ============================================================
      # 10. PATCH CLANG PATH
      # ============================================================
      - name: Configure Clang path
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          if grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            sed -i \
              "s|^CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=$CLANG_BIN|" \
              out/build.config
          else
            echo "CLANG_PREBUILT_BIN=$CLANG_BIN" >> out/build.config
          fi

          echo
          grep -n "^CLANG_PREBUILT_BIN=" out/build.config

      # ============================================================
      # 11. PREPARE INTERNAL HOST COMMANDS
      # ============================================================
      - name: Prepare internal host tools
        working-directory: gta9
        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          mkdir -p "$TOOL_DIR"

          echo "=== HOST COMMANDS ==="

          for cmd in \
            bash \
            sh \
            pwd \
            echo \
            printf \
            expr \
            basename \
            dirname \
            readlink \
            realpath \
            mkdir \
            rm \
            cp \
            mv \
            ln \
            chmod \
            touch \
            find \
            grep \
            sed \
            awk \
            cut \
            tr \
            sort \
            uniq \
            head \
            tail \
            cat \
            xargs \
            which \
            env \
            test \
            uname \
            nproc \
            make \
            gcc \
            g++ \
            ar \
            ld \
            objcopy \
            objdump \
            nm \
            strip \
            git \
            python3
          do
            if command -v "$cmd" >/dev/null 2>&1; then
              target="$(command -v "$cmd")"

              rm -f "$TOOL_DIR/$cmd"
              ln -s "$target" "$TOOL_DIR/$cmd"

              echo "$cmd -> $target"
            fi
          done

      # ============================================================
      # 12. INSTALL DIRECT LLVM EXECUTABLES
      # ============================================================
      - name: Install direct LLVM tools
        working-directory: gta9
        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          CLANG_BIN="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          # IMPORTANT:
          # Do NOT create:
          #
          # clang -> clang.real -> clang
          #
          # Use clang-12 directly.

          test -x "$CLANG_BIN/clang-12"

          rm -f "$TOOL_DIR/clang"
          cp -f "$CLANG_BIN/clang-12" "$TOOL_DIR/clang"
          chmod +x "$TOOL_DIR/clang"

          rm -f "$TOOL_DIR/clang++"
          cp -f "$CLANG_BIN/clang-12" "$TOOL_DIR/clang++"
          chmod +x "$TOOL_DIR/clang++"

          if [ -f "$CLANG_BIN/clang" ]; then
            cp -f "$CLANG_BIN/clang" \
              "$TOOL_DIR/android-clang-wrapper"
          fi

          if [ -f "$CLANG_BIN/clang++" ]; then
            cp -f "$CLANG_BIN/clang++" \
              "$TOOL_DIR/android-clangxx-wrapper"
          fi

          # --------------------------------------------------------
          # LLD
          # --------------------------------------------------------

          test -f "$CLANG_BIN/lld"

          rm -f "$TOOL_DIR/lld"
          cp -f "$CLANG_BIN/lld" "$TOOL_DIR/lld"
          chmod +x "$TOOL_DIR/lld"

          rm -f "$TOOL_DIR/ld.lld"
          ln -s lld "$TOOL_DIR/ld.lld"

          # --------------------------------------------------------
          # LLVM UTILITIES
          # --------------------------------------------------------

          for tool in \
            llvm-ar \
            llvm-as \
            llvm-cfi-verify \
            llvm-cov \
            llvm-dis \
            llvm-dwarfdump \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strings \
            llvm-strip \
            llvm-symbolizer
          do
            if [ -x "$CLANG_BIN/$tool" ]; then
              cp -f "$CLANG_BIN/$tool" "$TOOL_DIR/$tool"
              chmod +x "$TOOL_DIR/$tool"
            fi
          done

          echo
          echo "=== INTERNAL LLVM TOOLS ==="

          ls -lh \
            "$TOOL_DIR/clang" \
            "$TOOL_DIR/clang++" \
            "$TOOL_DIR/lld" \
            "$TOOL_DIR/ld.lld"

      # ============================================================
      # 13. TEST INTERNAL CLANG
      # ============================================================
      - name: Test internal Clang
        working-directory: gta9
        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          echo "=== INTERNAL CLANG VERSION ==="

          "$TOOL_DIR/clang" --version

          echo
          echo "=== INTERNAL CLANG++ VERSION ==="

          "$TOOL_DIR/clang++" --version

          echo
          echo "=== INTERNAL CLANG COMPILE ==="

          "$TOOL_DIR/clang" \
            --gcc-toolchain=/usr \
            -isystem /usr/include/x86_64-linux-gnu \
            -isystem /usr/include \
            -x c \
            -c /dev/null \
            -o /tmp/internal-clang-test.o

          echo "Internal Clang compile PASSED"

          echo
          echo "=== INTERNAL LLD ==="

          LD_LIBRARY_PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs" \
            "$TOOL_DIR/ld.lld" --version

      # ============================================================
      # 14. VERIFY HOST HEADERS
      # ============================================================
      - name: Verify host headers
        working-directory: gta9
        run: |
          set -eux

          test -f /usr/include/x86_64-linux-gnu/sys/types.h
          test -f /usr/include/x86_64-linux-gnu/bits/types.h

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          "$TOOL_DIR/clang" \
            --gcc-toolchain=/usr \
            -isystem /usr/include/x86_64-linux-gnu \
            -isystem /usr/include \
            -x c \
            -c /dev/null \
            -o /tmp/header-test.o

          echo "Host headers OK"

      # ============================================================
      # 15. VERIFY KERNELSU + CONFIG
      # ============================================================
      - name: Verify KernelSU and config
        working-directory: gta9
        run: |
          set -eux

          test -d KernelSU
          test -d KernelSU/kernel

          echo "=== KERNELSU CONFIG ==="

          grep -R "^CONFIG_KSU=y" kernel/configs || true

          echo
          echo "=== DEFCONFIG ==="

          test -f arch/arm64/configs/gta9_00_defconfig

          grep -E \
            "CONFIG_(ARCH_MEDIATEK|SAMSUNG_GKI_KERNEL|KSU|F2FS_FS)" \
            arch/arm64/configs/gta9_00_defconfig \
            kernel/configs/ot11.config \
            || true

      # ============================================================
      # 16. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: gta9
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

          LLVM: 1
          LLVM_IAS: 1

          OUT_DIR: out
          DIST_DIR: out

          # IMPORTANT:
          # build.sh expects BUILD_CONFIG relative to ROOT_DIR.
          BUILD_CONFIG: out/build.config

          HOSTCC: build/build-tools/path/linux-x86/clang
          HOSTCXX: build/build-tools/path/linux-x86/clang++

          HOSTAR: /usr/bin/ar
          HOSTLD: build/build-tools/path/linux-x86/ld.lld

          HOSTCFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          HOSTCXXFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          KBUILD_HOSTCFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          KBUILD_HOSTCXXFLAGS: "--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          LD_LIBRARY_PATH: ${{ github.workspace }}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs

        run: |
          set -eux

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          COMPAT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs"

          export PATH="$TOOL_DIR:$PATH"
          export LD_LIBRARY_PATH="$COMPAT:${LD_LIBRARY_PATH:-}"

          export HOSTCC="$TOOL_DIR/clang"
          export HOSTCXX="$TOOL_DIR/clang++"
          export HOSTAR="/usr/bin/ar"
          export HOSTLD="$TOOL_DIR/ld.lld"

          export HOSTCFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export HOSTCXXFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          export KBUILD_HOSTCFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export KBUILD_HOSTCXXFLAGS="--gcc-toolchain=/usr -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export OUT_DIR="out"
          export DIST_DIR="out"

          # IMPORTANT:
          # RELATIVE PATH ONLY
          export BUILD_CONFIG="out/build.config"

          echo
          echo "=================================================="
          echo "FINAL TOOLCHAIN CHECK"
          echo "=================================================="

          echo "PWD=$PWD"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "HOSTLD=$HOSTLD"
          echo "BUILD_CONFIG=$BUILD_CONFIG"
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          echo
          "$HOSTCC" --version

          echo
          "$HOSTCXX" --version

          echo
          "$HOSTLD" --version

          echo
          echo "=================================================="
          echo "BUILD CONFIG PATH CHECK"
          echo "=================================================="

          test -f "$BUILD_CONFIG"

          realpath "$BUILD_CONFIG"

          echo
          echo "=== BUILD CONFIG CONTENT ==="

          grep -n \
            -E "^(KERNEL_DIR|CLANG_PREBUILT_BIN|MAKE_GOALS|CONFIG_MTK_PLATFORM)" \
            "$BUILD_CONFIG" \
            || true

          echo
          echo "=================================================="
          echo "START KERNEL BUILD"
          echo "=================================================="

          ./build/build.sh \
            LLVM_IAS=1 \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            KBUILD_HOSTCFLAGS="$KBUILD_HOSTCFLAGS" \
            KBUILD_HOSTCXXFLAGS="$KBUILD_HOSTCXXFLAGS" \
            -j$(($(nproc)-1))

      # ============================================================
      # 17. INSPECT OUTPUT
      # ============================================================
      - name: Inspect build outputs
        if: success()
        working-directory: gta9
        run: |
          set -eux

          echo "=== KERNEL OUTPUTS ==="

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "vmlinux" \
            \) \
            -print

          echo
          echo "=== ARM64 BOOT ==="

          find out/kernel-5.10/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print \
            || true

      # ============================================================
      # 18. PACKAGE
      # ============================================================
      - name: Package kernel
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          if [ -f out/kernel-5.10/arch/arm64/boot/Image.gz ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/Image.gz \
              release/Image.gz
          fi

          if [ -f out/kernel-5.10/arch/arm64/boot/mt6789.dtb ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/mt6789.dtb \
              release/mt6789.dtb
          fi

          if [ -f out/kernel-5.10/arch/arm64/boot/mt8781_gta9_eur_open_00.dtbo ]; then
            cp \
              out/kernel-5.10/arch/arm64/boot/mt8781_gta9_eur_open_00.dtbo \
              release/mt8781_gta9_eur_open_00.dtbo
          fi

          if [ -f out/kernel-5.10/vmlinux ]; then
            cp \
              out/kernel-5.10/vmlinux \
              release/vmlinux
          fi

          echo
          echo "=== RELEASE FILES ==="

          ls -lh release

          test -n "$(find release -type f)"

          tar -czf \
            kernel-samsung-x110-gta9.tar.gz \
            -C release \
            .

      # ============================================================
      # 19. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-samsung-x110-gta9
          path: gta9/kernel-samsung-x110-gta9.tar.gz
          if-no-files-found: error

      # ============================================================
      # 20. DEBUG ARTIFACT
      # ============================================================
      - name: Upload debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-debug
          path: |
            gta9/out/build.config
            gta9/out/kernel-5.10/.config
            gta9/out/kernel-5.10/vmlinux
            gta9/out/kernel-5.10/arch/arm64/boot/**
          if-no-files-found: ignore
