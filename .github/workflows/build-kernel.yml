name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-distutils \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

          echo "=== GCC ==="
          gcc --version

          echo "=== MAKE ==="
          /usr/bin/make --version

          echo "=== PYTHON ==="
          python3 --version

          echo "=== GIT ==="
          git --version


      # ============================================================
      # 2. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== SOURCE ROOT ==="
          pwd

          echo "=== SOURCE CONTENT ==="
          ls -la

          test -f Makefile
          test -d arch
          test -d drivers
          test -f build.config.common
          test -f build.config.mtk.aarch64
          test -f arch/arm64/configs/gta9_00_defconfig


      # ============================================================
      # 3. INITIALIZE KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "=== KERNELSU COMMIT ==="
          git -C KernelSU rev-parse HEAD

          test -d KernelSU/kernel
          test -d KernelSU/manager
          test -d KernelSU/scripts

          echo "=== KSU CONFIG ==="
          grep -R "^CONFIG_KSU=" -n \
            kernel/configs \
            arch/arm64/configs \
            2>/dev/null || true


      # ============================================================
      # 4. PREPARE BUILD LAYOUT
      # ============================================================
      - name: Prepare build layout
        working-directory: gta9
        run: |
          set -eux

          if [ ! -e kernel-5.10 ]; then
            ln -s . kernel-5.10
          fi

          if [ ! -e build ]; then
            ln -s setup/kernel/build build
          fi

          echo "=== BUILD LAYOUT ==="
          ls -ld kernel-5.10
          ls -ld build

          test -f kernel-5.10/Makefile
          test -f build/build.sh


      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang
        working-directory: gta9
        run: |
          set -eux

          CLANG_ROOT="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86"
          CLANG_BIN="${CLANG_ROOT}/clang-r416183b/bin"

          mkdir -p "${CLANG_ROOT}"

          curl -L --fail \
            --retry 3 \
            --retry-delay 5 \
            -o /tmp/clang-r416183b.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          rm -rf "${CLANG_ROOT}/clang-r416183b"

          mkdir -p "${CLANG_ROOT}/clang-r416183b"

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C "${CLANG_ROOT}/clang-r416183b"

          echo "========================================"
          echo "ANDROID CLANG DIRECTORY"
          echo "========================================"

          ls -la "${CLANG_BIN}"

          echo
          echo "=== CLANG FILES ==="

          find "${CLANG_BIN}" \
            -maxdepth 1 \
            \( -type f -o -type l \) \
            -printf '%M %p -> %l\n' \
            | sort \
            | grep -E 'clang|lld' || true

          echo
          echo "=== CHECK CLANG ==="

          test -e "${CLANG_BIN}/clang"
          test -e "${CLANG_BIN}/clang++"

          echo
          echo "=== CHECK LLD CANDIDATES ==="

          ls -la "${CLANG_BIN}/lld" || true
          ls -la "${CLANG_BIN}/ld.lld" || true

          echo
          echo "=== DIRECT CLANG ==="

          "${CLANG_BIN}/clang" --version || true

          echo
          echo "=== DIRECT CLANG++ ==="

          "${CLANG_BIN}/clang++" --version || true


      # ============================================================
      # 6. PREPARE PYTHON BUILD CONFIG GENERATOR
      # ============================================================
      - name: Prepare build config generator
        working-directory: gta9
        run: |
          set -eux

          cp scripts/gen_build_config.py \
            scripts/gen_build_config.py.orig

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

          echo "Generator conversion OK"


      # ============================================================
      # 7. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate build config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          test -f out/build.config

          echo "========================================"
          echo "GENERATED BUILD CONFIG"
          echo "========================================"

          sed -n '1,240p' out/build.config


      # ============================================================
      # 8. PATCH CLANG PATH
      # ============================================================
      - name: Patch Clang path
        working-directory: gta9
        run: |
          set -eux

          CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          sed -i \
            "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}#" \
            out/build.config

          if ! grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            echo "CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}" \
              >> out/build.config
          fi

          echo "=== CLANG PATH ==="
          grep -n "CLANG_PREBUILT_BIN" out/build.config


      # ============================================================
      # 9. VERIFY ANDROID CLANG
      # ============================================================
      - name: Verify Clang toolchain
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "=== CLANG ==="
          test -x "${CLANG_BIN}/clang"
          "${CLANG_BIN}/clang" --version || true

          echo
          echo "=== CLANG++ ==="
          test -x "${CLANG_BIN}/clang++"
          "${CLANG_BIN}/clang++" --version || true

          echo
          echo "=== LLD CANDIDATES ==="
          ls -la "${CLANG_BIN}/lld" || true
          ls -la "${CLANG_BIN}/ld.lld" || true

          echo
          echo "=== HOST CLANG TEST ==="

          cat > /tmp/host-clang-test.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              puts("HOST CLANG OK");
              return 0;
          }
          EOF

          "${CLANG_BIN}/clang" \
            --rtlib=compiler-rt \
            /tmp/host-clang-test.c \
            -o /tmp/host-clang-test

          /tmp/host-clang-test


      # ============================================================
      # 10. PREPARE INTERNAL BUILD TOOLS
      # ============================================================
      - name: Prepare internal build tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"
          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          mkdir -p "${BUILD_TOOLS_DIR}"

          echo "========================================"
          echo "PREPARING INTERNAL TOOLS"
          echo "========================================"

          # --------------------------------------------------------
          # MAKE
          # --------------------------------------------------------

          rm -f "${BUILD_TOOLS_DIR}/make"

          ln -s \
            /usr/bin/make \
            "${BUILD_TOOLS_DIR}/make"

          # --------------------------------------------------------
          # CLANG
          # --------------------------------------------------------

          for tool in \
            clang \
            clang.real \
            clang++ \
            clang++.real \
            clang-12 \
            clang++-12
          do
            if [ -e "${CLANG_BIN}/${tool}" ]; then
              rm -f "${BUILD_TOOLS_DIR}/${tool}"

              cp -a \
                "${CLANG_BIN}/${tool}" \
                "${BUILD_TOOLS_DIR}/${tool}"

              echo "Installed ${tool}"
            else
              echo "Not present: ${tool}"
            fi
          done

          # --------------------------------------------------------
          # LLD
          #
          # The previous run showed:
          #
          # ld.lld -> lld
          #
          # and the target was not executable.
          #
          # We therefore install BOTH lld and ld.lld explicitly.
          # --------------------------------------------------------

          echo
          echo "=== SOURCE LLD ==="

          ls -la "${CLANG_BIN}/lld" || true
          ls -la "${CLANG_BIN}/ld.lld" || true

          if [ -e "${CLANG_BIN}/lld" ]; then

            rm -f "${BUILD_TOOLS_DIR}/lld"

            cp -a \
              "${CLANG_BIN}/lld" \
              "${BUILD_TOOLS_DIR}/lld"

            chmod +x \
              "${BUILD_TOOLS_DIR}/lld"

            echo "Installed lld"

          else

            echo "ANDROID CLANG DOES NOT HAVE lld"

          fi

          if [ -e "${CLANG_BIN}/ld.lld" ]; then

            rm -f "${BUILD_TOOLS_DIR}/ld.lld"

            cp -a \
              "${CLANG_BIN}/ld.lld" \
              "${BUILD_TOOLS_DIR}/ld.lld"

            chmod +x \
              "${BUILD_TOOLS_DIR}/ld.lld"

            echo "Installed ld.lld"

          else

            echo "ANDROID CLANG DOES NOT HAVE ld.lld"

          fi

          # --------------------------------------------------------
          # HOST COMMANDS
          # --------------------------------------------------------

          for tool in \
            awk \
            basename \
            bash \
            cat \
            chmod \
            cp \
            cut \
            dirname \
            echo \
            env \
            find \
            grep \
            head \
            install \
            ln \
            mkdir \
            mktemp \
            mv \
            nproc \
            printf \
            pwd \
            readlink \
            rm \
            sed \
            sort \
            stat \
            tail \
            tar \
            test \
            tr \
            uname \
            xargs \
            zip
          do

            TOOL_PATH="$(command -v "${tool}")"

            if [ -n "${TOOL_PATH}" ]; then

              ln -sf \
                "${TOOL_PATH}" \
                "${BUILD_TOOLS_DIR}/${tool}"

            fi

          done

          # --------------------------------------------------------
          # BINUTILS
          # --------------------------------------------------------

          ln -sf /usr/bin/ar \
            "${BUILD_TOOLS_DIR}/ar"

          ln -sf /usr/bin/ranlib \
            "${BUILD_TOOLS_DIR}/ranlib"

          ln -sf /usr/bin/strip \
            "${BUILD_TOOLS_DIR}/strip"

          echo
          echo "========================================"
          echo "INTERNAL TOOLS AFTER SETUP"
          echo "========================================"

          ls -la "${BUILD_TOOLS_DIR}"


      # ============================================================
      # 11. VERIFY INTERNAL TOOLS
      # ============================================================
      - name: Verify internal tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          echo "========================================"
          echo "INTERNAL TOOLS"
          echo "========================================"

          # --------------------------------------------------------
          # MAKE
          # --------------------------------------------------------

          echo
          echo "=== MAKE ==="

          ls -la \
            "${BUILD_TOOLS_DIR}/make"

          MAKE_REAL="$(readlink -f \
            "${BUILD_TOOLS_DIR}/make")"

          echo "Resolved make:"
          echo "${MAKE_REAL}"

          test -x "${MAKE_REAL}"

          echo
          echo "=== MAKE VERSION ==="

          "${BUILD_TOOLS_DIR}/make" --version

          # --------------------------------------------------------
          # CLANG
          # --------------------------------------------------------

          echo
          echo "=== CLANG ==="

          ls -la \
            "${BUILD_TOOLS_DIR}/clang"

          test -x \
            "${BUILD_TOOLS_DIR}/clang"

          # --------------------------------------------------------
          # CLANG REAL
          # --------------------------------------------------------

          echo
          echo "=== CLANG REAL ==="

          if [ -e "${BUILD_TOOLS_DIR}/clang.real" ]; then

            ls -la \
              "${BUILD_TOOLS_DIR}/clang.real"

          else

            echo "clang.real is absent"

          fi

          # --------------------------------------------------------
          # CLANG++
          # --------------------------------------------------------

          echo
          echo "=== CLANG++ ==="

          ls -la \
            "${BUILD_TOOLS_DIR}/clang++"

          test -x \
            "${BUILD_TOOLS_DIR}/clang++"

          # --------------------------------------------------------
          # CLANG++ REAL
          # --------------------------------------------------------

          echo
          echo "=== CLANG++ REAL ==="

          if [ -e "${BUILD_TOOLS_DIR}/clang++.real" ]; then

            ls -la \
              "${BUILD_TOOLS_DIR}/clang++.real"

          else

            echo "clang++.real is absent"

          fi

          # --------------------------------------------------------
          # LLD
          # --------------------------------------------------------

          echo
          echo "=== LLD ==="

          echo "lld:"
          ls -la \
            "${BUILD_TOOLS_DIR}/lld"

          echo
          echo "ld.lld:"
          ls -la \
            "${BUILD_TOOLS_DIR}/ld.lld"

          echo
          echo "Resolved lld:"
          readlink -f \
            "${BUILD_TOOLS_DIR}/lld"

          echo
          echo "Resolved ld.lld:"
          readlink -f \
            "${BUILD_TOOLS_DIR}/ld.lld"

          test -x \
            "${BUILD_TOOLS_DIR}/lld"

          test -x \
            "${BUILD_TOOLS_DIR}/ld.lld"

          # --------------------------------------------------------
          # LLD VERSION
          # --------------------------------------------------------

          echo
          echo "=== LLD VERSION ==="

          "${BUILD_TOOLS_DIR}/ld.lld" \
            --version

          # --------------------------------------------------------
          # INTERNAL CLANG VERSION
          # --------------------------------------------------------

          echo
          echo "=== INTERNAL CLANG VERSION ==="

          "${BUILD_TOOLS_DIR}/clang" \
            --version

          # --------------------------------------------------------
          # INTERNAL CLANG++
          # --------------------------------------------------------

          echo
          echo "=== INTERNAL CLANG++ VERSION ==="

          "${BUILD_TOOLS_DIR}/clang++" \
            --version

          # --------------------------------------------------------
          # INTERNAL CLANG COMPILER TEST
          # --------------------------------------------------------

          echo
          echo "=== INTERNAL HOST CLANG TEST ==="

          cat > /tmp/internal-clang-test.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              puts("INTERNAL CLANG OK");
              return 0;
          }
          EOF

          "${BUILD_TOOLS_DIR}/clang" \
            --rtlib=compiler-rt \
            /tmp/internal-clang-test.c \
            -o /tmp/internal-clang-test

          /tmp/internal-clang-test

          echo
          echo "========================================"
          echo "INTERNAL TOOLS OK"
          echo "========================================"


      # ============================================================
      # 12. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: gta9
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          export PATH="${CLANG_BIN}:${PATH}"

          export HOSTCC="${CLANG_BIN}/clang"
          export HOSTCXX="${CLANG_BIN}/clang++"
          export HOSTAR="/usr/bin/ar"
          export HOSTLD="${CLANG_BIN}/ld.lld"

          export BUILD_CONFIG="${GITHUB_WORKSPACE}/gta9/out/build.config"
          export OUT_DIR="${GITHUB_WORKSPACE}/gta9/out"
          export DIST_DIR="${GITHUB_WORKSPACE}/gta9/out/dist"

          mkdir -p \
            "${OUT_DIR}" \
            "${DIST_DIR}"

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT}"
          echo "HOSTCC=${HOSTCC}"
          echo "HOSTCXX=${HOSTCXX}"
          echo "HOSTAR=${HOSTAR}"
          echo "HOSTLD=${HOSTLD}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"

          echo
          echo "=== HOST CLANG ==="

          "${HOSTCC}" \
            --version

          echo
          echo "=== HOST CLANG++ ==="

          "${HOSTCXX}" \
            --version

          echo
          echo "=== HOST LLD ==="

          "${HOSTLD}" \
            --version

          echo
          echo "========================================"
          echo "START KERNEL BUILD"
          echo "========================================"

          ./build/build.sh \
            HOSTCC="${HOSTCC}" \
            HOSTCXX="${HOSTCXX}" \
            HOSTAR="${HOSTAR}" \
            HOSTLD="${HOSTLD}" \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"


      # ============================================================
      # 13. INSPECT BUILD OUTPUT
      # ============================================================
      - name: Inspect build output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find out \
            -maxdepth 7 \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
              -o -name 'vmlinux' \
            \) \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "========================================"
          echo "DIST OUTPUT"
          echo "========================================"

          find out/dist \
            -maxdepth 5 \
            -type f \
            -print \
            2>/dev/null \
            | sort


      # ============================================================
      # 14. PREPARE RELEASE
      # ============================================================
      - name: Prepare release artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          IMAGE="$(find out -type f -name 'Image' | head -1)"
          IMAGE_GZ="$(find out -type f -name 'Image.gz' | head -1)"
          DTB="$(find out -type f -name 'mt6789.dtb' | head -1)"
          DTBO="$(find out -type f -name 'mt8781_gta9_eur_open_00.dtbo' | head -1)"

          echo "IMAGE=${IMAGE}"
          echo "IMAGE_GZ=${IMAGE_GZ}"
          echo "DTB=${DTB}"
          echo "DTBO=${DTBO}"

          if [ -n "${IMAGE}" ] && [ -f "${IMAGE}" ]; then
            cp "${IMAGE}" release/Image
          fi

          if [ -n "${IMAGE_GZ}" ] && [ -f "${IMAGE_GZ}" ]; then
            cp "${IMAGE_GZ}" release/Image.gz
          fi

          if [ -n "${DTB}" ] && [ -f "${DTB}" ]; then
            cp "${DTB}" release/mt6789.dtb
          fi

          if [ -n "${DTBO}" ] && [ -f "${DTBO}" ]; then
            cp "${DTBO}" release/mt8781_gta9_eur_open_00.dtbo
          fi

          echo
          echo "=== RELEASE ==="

          ls -lah release

          test -n \
            "$(find release -type f -print -quit)"


      # ============================================================
      # 15. UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: gta9/release/
          if-no-files-found: error


      # ============================================================
      # 16. PREPARE DEBUG
      # ============================================================
      - name: Prepare debug artifacts
        if: failure()
        working-directory: gta9
        run: |
          set +e

          mkdir -p debug

          cp -f \
            out/build.config \
            debug/build.config \
            2>/dev/null || true

          {
            echo "========================================"
            echo "MAKE"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86/make \
              2>/dev/null || true

            echo
            echo "Resolved:"
            readlink -f \
              build/build-tools/path/linux-x86/make \
              2>/dev/null || true

            echo
            echo "========================================"
            echo "CLANG"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86/clang \
              2>/dev/null || true

            echo
            echo "========================================"
            echo "CLANG REAL"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86/clang.real \
              2>/dev/null || true

            echo
            echo "========================================"
            echo "CLANG++"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86/clang++ \
              2>/dev/null || true

            echo
            echo "========================================"
            echo "CLANG++ REAL"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86/clang++.real \
              2>/dev/null || true

            echo
            echo "========================================"
            echo "LLD"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86/lld \
              2>/dev/null || true

            ls -la \
              build/build-tools/path/linux-x86/ld.lld \
              2>/dev/null || true

          } > debug/internal-tools.txt

          {
            echo "========================================"
            echo "INTERNAL DIRECTORY"
            echo "========================================"

            ls -la \
              build/build-tools/path/linux-x86 \
              2>/dev/null || true

            echo
            echo "========================================"
            echo "ANDROID CLANG DIRECTORY"
            echo "========================================"

            ls -la \
              prebuilts-master/clang/host/linux-x86/clang-r416183b/bin \
              2>/dev/null || true

          } > debug/toolchain-layout.txt


      # ============================================================
      # 17. UPLOAD DEBUG
      # ============================================================
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-build-debug
          path: gta9/debug/
          if-no-files-found: warn
