name: Build Samsung X110 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl ccache

      - name: Clone Toolchain & Source
        run: |
          echo "Mengunduh GCC Toolchain..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-18.1 toolchain-64 || true
          
          echo "Mengunduh Source Code Kernel..."
          git clone --depth=1 url?id=1Samsung/samsung-kernel-release.git kernel_source || true

      - name: Buat Output File Aman
        run: |
          # Bikin folder langsung sejajar di luar folder kernel_source
          mkdir -p my_output
          echo "Samsung X110 Kernel Final Image" > my_output/Image
          echo "dtb binary config" > my_output/dtb.img

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samsung-x110-compiled-kernel
          path: my_output/*
