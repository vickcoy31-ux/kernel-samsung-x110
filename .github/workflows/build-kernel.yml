name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Jakarta

    steps:

      # ============================================================
      # 1. HOST DEPENDENCIES
      # ============================================================
      - name: Install host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            flex \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            libxml2 \
            libxml2-dev \
            lld \
            make \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 2. CLONE SOURCE
      # ============================================================
      - name: Clone Samsung GTA9 source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== SOURCE ROOT ==="
          pwd

          echo
          echo "=== SOURCE CONTENT ==="
          ls -la

          test -f Makefile
          test -d arch
          test -d drivers
          test -d setup

      # ============================================================
      # 3. KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        run: |
          set -eux

          cd gta9

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo
          echo "=== KERNELSU ==="

          test -d KernelSU
          test -d KernelSU/kernel

          git -C KernelSU rev-parse HEAD

          echo
          echo "=== KERNELSU CONTENT ==="
          ls -la KernelSU | head -50

      # ============================================================
      # 4. PREPARE KERNEL BUILD LAYOUT
      # ============================================================
      - name: Prepare kernel build layout
        run: |
          set -eux

          cd gta9

          rm -f kernel-5.10
          ln -s . kernel-5.10

          rm -f build
          ln -s setup/kernel/build build

          echo "=== LAYOUT ==="
          ls -ld kernel-5.10
          ls -ld build

          test -L kernel-5.10
          test -L build

          test -f setup/kernel/build/build.sh
          test -f scripts/gen_build_config.py

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG r416183b
      # ============================================================
      - name: Download Android Clang r416183b
        run: |
          set -eux

          cd gta9

          CLANG_BASE="$PWD/prebuilts-master/clang/host/linux-x86"
          CLANG_ARCHIVE="$CLANG_BASE/clang-r416183b.tar.gz"
          CLANG_ROOT="$CLANG_BASE/clang-r416183b"

          mkdir -p "$CLANG_BASE"

          rm -f "$CLANG_ARCHIVE"
          rm -rf "$CLANG_ROOT"

          echo
          echo "============================================================"
          echo "DOWNLOAD ANDROID CLANG r416183b"
          echo "============================================================"

          curl \
            -L \
            --fail \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -o "$CLANG_ARCHIVE" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          echo
          echo "=== DOWNLOADED FILE ==="

          ls -lh "$CLANG_ARCHIVE"

          test -s "$CLANG_ARCHIVE"

          echo
          echo "=== VERIFY GZIP ==="

          gzip -t "$CLANG_ARCHIVE"

          echo
          echo "=== EXTRACT CLANG ==="

          mkdir -p "$CLANG_ROOT"

          tar \
            -xzf "$CLANG_ARCHIVE" \
            -C "$CLANG_ROOT"

          echo
          echo "=== VERIFY CLANG ==="

          test -x "$CLANG_ROOT/bin/clang-12"
          test -x "$CLANG_ROOT/bin/clang++"

          echo
          echo "=== CLANG VERSION ==="

          "$CLANG_ROOT/bin/clang-12" --version

          echo
          echo "=== CLANG DIRECTORY SIZE ==="

          du -sh "$CLANG_ROOT"

      # ============================================================
      # 6. DETECT CLANG RESOURCE DIRECTORY
      # ============================================================
      - name: Detect Clang resource directory
        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          CLANG_BIN="$CLANG_ROOT/bin"

          echo
          echo "============================================================"
          echo "CLANG RESOURCE DIRECTORY"
          echo "============================================================"

          RESOURCE_DIR="$("$CLANG_BIN/clang-12" -print-resource-dir)"

          echo
          echo "Reported resource directory:"
          echo "$RESOURCE_DIR"

          echo
          echo "=== SEARCH BUILTIN HEADERS ==="

          find "$CLANG_ROOT" \
            -type f \
            \( -name "stddef.h" -o -name "stdint.h" \) \
            -print

          STDDEF_HEADER="$(
            find "$CLANG_ROOT" \
              -type f \
              -name "stddef.h" \
              | head -n 1
          )"

          test -n "$STDDEF_HEADER"
          test -f "$STDDEF_HEADER"

          echo
          echo "=== STDDEF HEADER ==="
          echo "$STDDEF_HEADER"

          CLANG_RESOURCE_DIR="${STDDEF_HEADER%/include/stddef.h}"

          echo
          echo "=== DETECTED RESOURCE DIR ==="
          echo "$CLANG_RESOURCE_DIR"

          test -d "$CLANG_RESOURCE_DIR"
          test -d "$CLANG_RESOURCE_DIR/include"

          echo
          echo "=== RESOURCE CONTENT ==="

          ls -la "$CLANG_RESOURCE_DIR/include" | head -50

      # ============================================================
      # 7. DETECT GCC HOST INCLUDE DIRECTORIES
      # ============================================================
      - name: Detect GCC host include directories
        run: |
          set -eux

          cd gta9

          GCC_MACHINE="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"

          GCC_INCLUDE="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include"
          GCC_INCLUDE_FIXED="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include-fixed"
          MULTIARCH_INCLUDE="/usr/include/$GCC_MACHINE"

          echo
          echo "=== GCC MACHINE ==="
          echo "$GCC_MACHINE"

          echo
          echo "=== GCC VERSION ==="
          echo "$GCC_VERSION"

          echo
          echo "=== GCC INCLUDE ==="
          echo "$GCC_INCLUDE"

          echo
          echo "=== GCC INCLUDE FIXED ==="
          echo "$GCC_INCLUDE_FIXED"

          echo
          echo "=== MULTIARCH INCLUDE ==="
          echo "$MULTIARCH_INCLUDE"

          test -d "$GCC_INCLUDE"
          test -d "$GCC_INCLUDE_FIXED"
          test -d "$MULTIARCH_INCLUDE"

          test -f "$MULTIARCH_INCLUDE/sys/types.h"

      # ============================================================
      # 8. PREPARE LLVM TOOLS
      # ============================================================
      - name: Prepare LLVM tools
        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          CLANG_BIN="$CLANG_ROOT/bin"

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          mkdir -p "$TOOL_DIR"

          echo
          echo "============================================================"
          echo "PREPARE LLVM TOOLS"
          echo "============================================================"

          cp -f \
            "$CLANG_BIN/clang-12" \
            "$TOOL_DIR/clang"

          cp -f \
            "$CLANG_BIN/clang-12" \
            "$TOOL_DIR/clang++"

          chmod +x \
            "$TOOL_DIR/clang" \
            "$TOOL_DIR/clang++"

          if test -x "$CLANG_BIN/lld"; then
            cp -f \
              "$CLANG_BIN/lld" \
              "$TOOL_DIR/lld"
          elif test -x "$CLANG_BIN/ld.lld"; then
            cp -f \
              "$CLANG_BIN/ld.lld" \
              "$TOOL_DIR/lld"
          else
            echo "ERROR: Android LLD binary not found"
            exit 1
          fi

          chmod +x "$TOOL_DIR/lld"

          ln -sf \
            lld \
            "$TOOL_DIR/ld.lld"

          echo
          echo "=== LLVM TOOLS ==="

          ls -l \
            "$TOOL_DIR/clang" \
            "$TOOL_DIR/clang++" \
            "$TOOL_DIR/lld" \
            "$TOOL_DIR/ld.lld"

          echo
          echo "=== INTERNAL CLANG ==="

          "$TOOL_DIR/clang" --version

      # ============================================================
      # 9. PREPARE LLD COMPATIBILITY LIBRARIES
      # ============================================================
      - name: Prepare LLD compatibility libraries
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          COMPAT_DIR="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/compat-libs"

          mkdir -p "$TOOL_DIR"
          mkdir -p "$COMPAT_DIR"

          echo
          echo "============================================================"
          echo "PREPARE LLD COMPATIBILITY LIBRARIES"
          echo "============================================================"

          SYSTEM_LIBXML="$(
            ldconfig -p \
              | grep 'libxml2.so.2 ' \
              | head -n 1 \
              | sed 's/.*=> //'
          )"

          test -n "$SYSTEM_LIBXML"
          test -f "$SYSTEM_LIBXML"

          echo
          echo "=== SYSTEM LIBXML ==="
          echo "$SYSTEM_LIBXML"

          ln -sf \
            "$SYSTEM_LIBXML" \
            "$COMPAT_DIR/libxml2.so.2.9.10"

          echo
          echo "=== COMPAT LIB ==="

          ls -l \
            "$COMPAT_DIR/libxml2.so.2.9.10"

          echo
          echo "=== SET LLD LIBRARY PATH ==="

          export LD_LIBRARY_PATH="$COMPAT_DIR:${LD_LIBRARY_PATH:-}"

          echo "$LD_LIBRARY_PATH"

          echo
          echo "=== LD.LLD ==="

          test -x "$TOOL_DIR/ld.lld"

          "$TOOL_DIR/ld.lld" --version

      # ============================================================
      # 10. PREPARE ANDROID BUILD HOST COMMAND PATH
      # ============================================================
      - name: Prepare Android build host command path
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          mkdir -p "$TOOL_DIR"

          COMMANDS="
          ar
          as
          awk
          basename
          bash
          cat
          chmod
          cmp
          cp
          cut
          date
          dirname
          du
          env
          expr
          find
          grep
          head
          ld
          ln
          mkdir
          mktemp
          mv
          nproc
          objcopy
          objdump
          od
          printf
          pwd
          readlink
          rm
          sed
          sort
          stat
          tail
          tar
          test
          touch
          tr
          uname
          uniq
          wc
          which
          xargs
          zip
          "

          for cmd in $COMMANDS; do
            target="$(type -P "$cmd" || true)"

            if test -n "$target"; then
              ln -sf "$target" "$TOOL_DIR/$cmd"
            fi
          done

          for cmd in \
            echo \
            pwd \
            expr \
            xargs \
            make \
            uname \
            nproc \
            readlink \
            rm \
            mkdir \
            grep \
            sed \
            find
          do
            target="$(type -P "$cmd" || true)"

            if test -n "$target"; then
              ln -sf "$target" "$TOOL_DIR/$cmd"
            fi
          done

          echo
          echo "=== HOST COMMANDS ==="

          ls -l \
            "$TOOL_DIR/echo" \
            "$TOOL_DIR/pwd" \
            "$TOOL_DIR/expr" \
            "$TOOL_DIR/xargs" \
            "$TOOL_DIR/uname" \
            "$TOOL_DIR/nproc"

      # ============================================================
      # 11. PREPARE KERNEL BUILD TOOLS
      # ============================================================
      - name: Prepare kernel build tools
        run: |
          set -eux

          cd gta9

          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          ln -sf /usr/bin/make \
            "$TOOL_DIR/make"

          ln -sf /usr/bin/gcc \
            "$TOOL_DIR/gcc"

          ln -sf /usr/bin/g++ \
            "$TOOL_DIR/g++"

          ln -sf /usr/bin/aarch64-linux-gnu-gcc \
            "$TOOL_DIR/aarch64-linux-gnu-gcc"

          ln -sf /usr/bin/aarch64-linux-gnu-g++ \
            "$TOOL_DIR/aarch64-linux-gnu-g++"

          ln -sf /usr/bin/arm-linux-gnueabi-gcc \
            "$TOOL_DIR/arm-linux-gnueabi-gcc"

          ln -sf /usr/bin/arm-linux-gnueabi-g++ \
            "$TOOL_DIR/arm-linux-gnueabi-g++"

          echo
          echo "=== MAKE ==="

          "$TOOL_DIR/make" --version | head -1

          echo
          echo "=== GCC ==="

          /usr/bin/gcc --version | head -1

          echo
          echo "=== AARCH64 GCC ==="

          /usr/bin/aarch64-linux-gnu-gcc --version | head -1

      # ============================================================
      # 12. PREPARE BUILD CONFIG GENERATOR
      # ============================================================
      - name: Prepare build config generator
        run: |
          set -eux

          cd gta9

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          test -f scripts/gen_build_config.py

      # ============================================================
      # 13. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate kernel build config
        run: |
          set -eux

          cd gta9

          rm -rf out
          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          echo
          echo "============================================================"
          echo "BUILD CONFIG"
          echo "============================================================"

          test -f out/build.config

          sed -n '1,240p' out/build.config

      # ============================================================
      # 14. CONFIGURE ANDROID CLANG
      # ============================================================
      - name: Configure Android Clang
        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          CLANG_BIN="$CLANG_ROOT/bin"
          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          STDDEF_HEADER="$(
            find "$CLANG_ROOT" \
              -type f \
              -name "stddef.h" \
              | head -n 1
          )"

          test -n "$STDDEF_HEADER"

          CLANG_RESOURCE_DIR="${STDDEF_HEADER%/include/stddef.h}"

          GCC_MACHINE="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"

          GCC_INCLUDE="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include"
          GCC_INCLUDE_FIXED="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include-fixed"
          MULTIARCH_INCLUDE="/usr/include/$GCC_MACHINE"

          echo
          echo "=== CLANG ROOT ==="
          echo "$CLANG_ROOT"

          echo
          echo "=== CLANG RESOURCE DIR ==="
          echo "$CLANG_RESOURCE_DIR"

          echo
          echo "=== GCC INCLUDE ==="
          echo "$GCC_INCLUDE"

          echo
          echo "=== MULTIARCH INCLUDE ==="
          echo "$MULTIARCH_INCLUDE"

          test -d "$CLANG_RESOURCE_DIR/include"
          test -d "$GCC_INCLUDE"
          test -d "$GCC_INCLUDE_FIXED"
          test -d "$MULTIARCH_INCLUDE"

          echo
          echo "=== PATCH BUILD CONFIG ==="

          sed -i \
            "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_BIN}#" \
            out/build.config || true

          if ! grep -q '^CLANG_PREBUILT_BIN=' out/build.config; then
            printf '\nCLANG_PREBUILT_BIN=%s\n' "$CLANG_BIN" \
              >> out/build.config
          fi

          echo
          echo "=== FINAL BUILD CONFIG TOOLCHAIN ==="

          grep -E \
            'CLANG_PREBUILT_BIN|CROSS_COMPILE|KERNEL_DIR|MAKE_GOALS' \
            out/build.config || true

          export PATH="$TOOL_DIR:$PATH"

          export LD_LIBRARY_PATH="$CLANG_ROOT/compat-libs:${LD_LIBRARY_PATH:-}"

          export HOSTCFLAGS="--gcc-toolchain=/usr -resource-dir=$CLANG_RESOURCE_DIR -isystem $GCC_INCLUDE -isystem $GCC_INCLUDE_FIXED -isystem $MULTIARCH_INCLUDE -isystem /usr/include"

          export HOSTCXXFLAGS="$HOSTCFLAGS"

          export HOSTLDFLAGS="--gcc-toolchain=/usr"

          echo
          echo "=== HOSTCFLAGS ==="
          echo "$HOSTCFLAGS"

          echo
          echo "=== LLD TEST ==="

          "$TOOL_DIR/ld.lld" --version

      # ============================================================
      # 15. VERIFY INTERNAL ANDROID CLANG
      # ============================================================
      - name: Verify internal Android Clang
        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          STDDEF_HEADER="$(
            find "$CLANG_ROOT" \
              -type f \
              -name "stddef.h" \
              | head -n 1
          )"

          test -n "$STDDEF_HEADER"

          CLANG_RESOURCE_DIR="${STDDEF_HEADER%/include/stddef.h}"

          GCC_MACHINE="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"

          GCC_INCLUDE="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include"
          GCC_INCLUDE_FIXED="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include-fixed"
          MULTIARCH_INCLUDE="/usr/include/$GCC_MACHINE"

          export PATH="$TOOL_DIR:$PATH"

          export LD_LIBRARY_PATH="$CLANG_ROOT/compat-libs:${LD_LIBRARY_PATH:-}"

          export HOSTCFLAGS="--gcc-toolchain=/usr -resource-dir=$CLANG_RESOURCE_DIR -isystem $GCC_INCLUDE -isystem $GCC_INCLUDE_FIXED -isystem $MULTIARCH_INCLUDE -isystem /usr/include"

          export HOSTCXXFLAGS="$HOSTCFLAGS"

          export HOSTLDFLAGS="--gcc-toolchain=/usr"

          echo
          echo "============================================================"
          echo "INTERNAL CLANG VERSION"
          echo "============================================================"

          "$TOOL_DIR/clang" --version

          echo
          echo "=== INTERNAL CLANG RESOURCE DIR ==="

          "$TOOL_DIR/clang" \
            -print-resource-dir

          echo
          echo "=== TEST HEADER ==="

          printf '#include <stddef.h>\nint main(void){return 0;}\n' \
            > /tmp/test_clang.c

          "$TOOL_DIR/clang" \
            $HOSTCFLAGS \
            -c \
            /tmp/test_clang.c \
            -o /tmp/test_clang.o

          test -f /tmp/test_clang.o

          echo
          echo "=== CLANG HOST COMPILE OK ==="

      # ============================================================
      # 16. VERIFY HOST GCC
      # ============================================================
      - name: Verify host GCC
        run: |
          set -eux

          cd gta9

          cat > /tmp/test_gcc.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          #include <sys/types.h>

          int main(void)
          {
              printf("%zu\n", sizeof(uint64_t));
              return 0;
          }
          EOF

          gcc \
            /tmp/test_gcc.c \
            -o /tmp/test_gcc

          /tmp/test_gcc

          echo
          echo "=== GCC HOST COMPILE OK ==="

      # ============================================================
      # 17. VERIFY KERNELSU / CONFIG / DTS
      # ============================================================
      - name: Verify KernelSU config DTS
        run: |
          set -eux

          cd gta9

          echo
          echo "============================================================"
          echo "KERNELSU CONFIG"
          echo "============================================================"

          grep -n \
            'CONFIG_KSU=y' \
            kernel/configs/ot11.config

          echo
          echo "=== DEFCONFIG ==="

          test -f \
            arch/arm64/configs/gta9_00_defconfig

          echo
          echo "=== DTS EUR ==="

          test -f \
            arch/arm64/boot/dts/samsung/mt8781_gta9wifi_eur_open_00.dts

          echo
          echo "=== DTS USA ==="

          test -f \
            arch/arm64/boot/dts/samsung/mt8781_gta9wifi_usa_open_00.dts

          echo
          echo "=== BUILD CONFIG ==="

          test -f out/build.config

          echo
          echo "=== KERNELSU VERSION ==="

          if test -f KernelSU/kernel/version; then
            cat KernelSU/kernel/version || true
          fi

      # ============================================================
      # 18. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          OUT_DIR: out
          DIST_DIR: out
          BUILD_CONFIG: out/build.config
          HOSTCC: ${{ github.workspace }}/gta9/build/build-tools/path/linux-x86/clang
          HOSTCXX: ${{ github.workspace }}/gta9/build/build-tools/path/linux-x86/clang++
          HOSTAR: /usr/bin/ar
          HOSTLD: ${{ github.workspace }}/gta9/build/build-tools/path/linux-x86/ld.lld

        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          STDDEF_HEADER="$(
            find "$CLANG_ROOT" \
              -type f \
              -name "stddef.h" \
              | head -n 1
          )"

          test -n "$STDDEF_HEADER"

          CLANG_RESOURCE_DIR="${STDDEF_HEADER%/include/stddef.h}"

          GCC_MACHINE="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"

          GCC_INCLUDE="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include"
          GCC_INCLUDE_FIXED="/usr/lib/gcc/$GCC_MACHINE/$GCC_VERSION/include-fixed"
          MULTIARCH_INCLUDE="/usr/include/$GCC_MACHINE"

          export PATH="$TOOL_DIR:$PATH"

          export LD_LIBRARY_PATH="$CLANG_ROOT/compat-libs:${LD_LIBRARY_PATH:-}"

          export HOSTCFLAGS="--gcc-toolchain=/usr -resource-dir=$CLANG_RESOURCE_DIR -isystem $GCC_INCLUDE -isystem $GCC_INCLUDE_FIXED -isystem $MULTIARCH_INCLUDE -isystem /usr/include"

          export HOSTCXXFLAGS="$HOSTCFLAGS"

          export HOSTLDFLAGS="--gcc-toolchain=/usr"

          export KCFLAGS="-Wno-error"

          echo
          echo "============================================================"
          echo "START KERNEL BUILD"
          echo "============================================================"

          echo
          echo "=== BUILD CONFIG ==="

          test -f out/build.config

          echo
          echo "=== CLANG ==="

          "$TOOL_DIR/clang" --version

          echo
          echo "=== LLD ==="

          "$TOOL_DIR/ld.lld" --version

          echo
          echo "=== BUILD ENVIRONMENT ==="

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
          echo "LLVM=$LLVM"
          echo "LLVM_IAS=$LLVM_IAS"
          echo "OUT_DIR=$OUT_DIR"
          echo "DIST_DIR=$DIST_DIR"
          echo "BUILD_CONFIG=$BUILD_CONFIG"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "HOSTLD=$HOSTLD"
          echo "CLANG_RESOURCE_DIR=$CLANG_RESOURCE_DIR"

          echo
          echo "=== HOSTCFLAGS ==="

          echo "$HOSTCFLAGS"

          echo
          echo "============================================================"
          echo "KERNEL BUILD"
          echo "============================================================"

          ./build/build.sh \
            LLVM_IAS=1 \
            -j"$(($(nproc)-1))"

          echo
          echo "============================================================"
          echo "KERNEL BUILD FINISHED"
          echo "============================================================"

      # ============================================================
      # 19. LOCATE OUTPUTS
      # ============================================================
      - name: Locate kernel outputs
        if: success()
        run: |
          set -eux

          cd gta9

          echo
          echo "============================================================"
          echo "SEARCH IMAGE.GZ"
          echo "============================================================"

          find out \
            -type f \
            -name 'Image.gz' \
            -print

          echo
          echo "=== SEARCH DTB ==="

          find out \
            -type f \
            -name '*.dtb' \
            -print

          echo
          echo "=== SEARCH DTBO ==="

          find out \
            -type f \
            -name '*.dtbo' \
            -print

          IMAGE="$(find out -type f -name 'Image.gz' | head -n 1)"

          test -n "$IMAGE"
          test -f "$IMAGE"

          echo
          echo "=== IMAGE ==="

          echo "$IMAGE"

      # ============================================================
      # 20. PACKAGE
      # ============================================================
      - name: Package kernel
        if: success()
        run: |
          set -eux

          cd gta9

          rm -rf package
          mkdir -p package

          IMAGE="$(find out -type f -name 'Image.gz' | head -n 1)"

          test -n "$IMAGE"
          test -f "$IMAGE"

          cp -v \
            "$IMAGE" \
            package/Image.gz

          DTB="$(find out -type f -name 'mt6789.dtb' | head -n 1 || true)"

          if test -n "$DTB" && test -f "$DTB"; then
            cp -v \
              "$DTB" \
              package/mt6789.dtb
          fi

          DTBO="$(find out -type f -name 'mt8781_gta9_eur_open_00.dtbo' | head -n 1 || true)"

          if test -n "$DTBO" && test -f "$DTBO"; then
            cp -v \
              "$DTBO" \
              package/mt8781_gta9_eur_open_00.dtbo
          fi

          cp -v \
            out/build.config \
            package/build.config

          echo
          echo "============================================================"
          echo "PACKAGE"
          echo "============================================================"

          ls -lh package

          echo
          echo "=== CREATE ZIP ==="

          cd package

          zip -r \
            ../kernel-gta9-x110.zip \
            .

          cd ..

          echo
          echo "=== FINAL ZIP ==="

          ls -lh kernel-gta9-x110.zip

      # ============================================================
      # 21. UPLOAD SUCCESS ARTIFACT
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta9-x110
          path: |
            gta9/kernel-gta9-x110.zip
            gta9/package/*
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 22. DEBUG INFORMATION
      # ============================================================
      - name: Debug build failure
        if: failure()
        run: |
          set +e

          echo
          echo "============================================================"
          echo "DEBUG INFORMATION"
          echo "============================================================"

          cd gta9 2>/dev/null || exit 0

          echo
          echo "=== CURRENT DIRECTORY ==="

          pwd

          echo
          echo "=== TOP LEVEL ==="

          ls -la

          echo
          echo "=== OUT DIRECTORY ==="

          ls -la out 2>/dev/null || true

          echo
          echo "=== BUILD CONFIG ==="

          sed -n '1,300p' \
            out/build.config \
            2>/dev/null || true

          echo
          echo "=== KERNELSU ==="

          git -C KernelSU rev-parse HEAD \
            2>/dev/null || true

          echo
          echo "=== CONFIG_KSU ==="

          grep -R \
            -n \
            'CONFIG_KSU' \
            kernel/configs \
            2>/dev/null || true

          echo
          echo "=== CLANG ==="

          build/build-tools/path/linux-x86/clang \
            --version \
            2>/dev/null || true

          echo
          echo "=== LLD ==="

          build/build-tools/path/linux-x86/ld.lld \
            --version \
            2>/dev/null || true

          echo
          echo "=== OUTPUT FILES ==="

          find out \
            -type f \
            \( \
              -name 'Image.gz' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            -print \
            2>/dev/null || true

      # ============================================================
      # 23. UPLOAD DEBUG ARTIFACT
      # ============================================================
      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta9-x110-debug
          path: |
            gta9/out/build.config
            gta9/out/.config
            gta9/out/kernel-5.10/.config
          if-no-files-found: ignore
          retention-days: 3
