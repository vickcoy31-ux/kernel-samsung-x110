name: Build Kernel - Samsung X110

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            wget \
            curl \
            ccache \
            rsync \
            kmod \
            cpio \
            python3 \
            lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Inject KernelSU
        run: |
          set -e
          rm -rf drivers/kernelsu
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/obj-.*kernelsu/d' drivers/Makefile

          git clone --depth=1 https://github.com/tiann/KernelSU.git /tmp/KernelSU
          ln -s /tmp/KernelSU/kernel drivers/kernelsu

          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: Prepare Defconfig
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"

          make gta9_00_defconfig
          ./scripts/config --enable CONFIG_KSU

      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          make -j"$(nproc)" CC=clang LLVM=1 LLVM_IAS=1 Image.gz dtbs

      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-x110-kernel-kernelsu
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb
            arch/arm64/boot/dts/**/*.dtbo
