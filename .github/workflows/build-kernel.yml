name: Build Samsung Galaxy Tab A9 X110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-distutils \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

          gcc --version
          python3 --version
          git --version

      # ============================================================
      # 2. CHECKOUT SOURCE
      # ============================================================
      - name: Clone kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== SOURCE ROOT ==="
          pwd

          echo "=== SOURCE CONTENT ==="
          ls -la

          test -f Makefile
          test -d arch
          test -d drivers
          test -f build.config.common
          test -f build.config.mtk.aarch64
          test -f arch/arm64/configs/gta9_00_defconfig

      # ============================================================
      # 3. KERNELSU
      # ============================================================
      - name: Initialize KernelSU
        working-directory: gta9
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --depth=1

          echo "=== KERNELSU ==="
          git -C KernelSU rev-parse HEAD

          test -d KernelSU/kernel
          test -d KernelSU/manager
          test -d KernelSU/scripts

          echo "=== CONFIG_KSU ==="
          grep -R "^CONFIG_KSU=" -n kernel/configs arch/arm64/configs 2>/dev/null || true

      # ============================================================
      # 4. BUILD LAYOUT COMPATIBILITY
      # ============================================================
      - name: Prepare build layout
        working-directory: gta9
        run: |
          set -eux

          # The original build infrastructure expects:
          #   kernel-5.10/
          #   build/
          #
          # But this repository itself is the kernel source tree.

          if [ ! -e kernel-5.10 ]; then
            ln -s . kernel-5.10
          fi

          if [ ! -e build ]; then
            ln -s setup/kernel/build build
          fi

          echo "=== BUILD LAYOUT ==="
          ls -ld kernel-5.10
          ls -ld build

          test -f kernel-5.10/Makefile
          test -f build/build.sh

          echo "=== BUILD SCRIPT ==="
          head -40 build/build.sh

      # ============================================================
      # 5. DOWNLOAD ANDROID CLANG R416183B
      # ============================================================
      - name: Download Android Clang
        working-directory: gta9
        run: |
          set -eux

          CLANG_ROOT="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86"
          CLANG_BIN="${CLANG_ROOT}/clang-r416183b/bin"

          mkdir -p "${CLANG_ROOT}"

          curl -L --fail \
            --retry 3 \
            --retry-delay 5 \
            -o /tmp/clang-r416183b.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

          rm -rf "${CLANG_ROOT}/clang-r416183b"

          mkdir -p "${CLANG_ROOT}/clang-r416183b"

          tar -xzf \
            /tmp/clang-r416183b.tar.gz \
            -C "${CLANG_ROOT}/clang-r416183b"

          echo "=== CLANG BIN DIRECTORY ==="
          ls -la "${CLANG_BIN}"

          echo "=== CLANG EXECUTABLES ==="
          find "${CLANG_BIN}" -maxdepth 1 \
            \( -type f -o -type l \) \
            -printf '%M %p -> %l\n' \
            | sort \
            | grep -E 'clang|ld.lld' || true

          echo "=== CLANG FILES ==="

          test -e "${CLANG_BIN}/clang"
          test -e "${CLANG_BIN}/clang++"
          test -e "${CLANG_BIN}/ld.lld"

          # Do not assume clang.real exists yet.
          # Print the actual archive layout first.
          if [ -e "${CLANG_BIN}/clang.real" ]; then
            echo "clang.real EXISTS"
          else
            echo "clang.real NOT FOUND IN ARCHIVE"
          fi

          if [ -e "${CLANG_BIN}/clang++.real" ]; then
            echo "clang++.real EXISTS"
          else
            echo "clang++.real NOT FOUND IN ARCHIVE"
          fi

          echo "=== CLANG VERSION DIRECT ==="
          "${CLANG_BIN}/clang" --version || true

          echo "=== CLANG++ VERSION DIRECT ==="
          "${CLANG_BIN}/clang++" --version || true

      # ============================================================
      # 6. CONVERT OLD PYTHON GENERATOR TO PYTHON 3
      # ============================================================
      - name: Prepare build config generator
        working-directory: gta9
        run: |
          set -eux

          cp scripts/gen_build_config.py \
             scripts/gen_build_config.py.orig

          python3 -m lib2to3 \
            -w \
            scripts/gen_build_config.py

          python3 -m py_compile \
            scripts/gen_build_config.py

          echo "Generator conversion OK"

      # ============================================================
      # 7. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate build config
        working-directory: gta9
        run: |
          set -eux

          mkdir -p out

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

          echo "=== GENERATED BUILD CONFIG ==="
          sed -n '1,240p' out/build.config

          test -f out/build.config

      # ============================================================
      # 8. PATCH GENERATED CLANG PATH
      # ============================================================
      - name: Patch Clang path
        working-directory: gta9
        run: |
          set -eux

          CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          test -d "${CLANG_PREBUILT_BIN}"

          sed -i \
            "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}#" \
            out/build.config

          if ! grep -q "^CLANG_PREBUILT_BIN=" out/build.config; then
            echo "CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN}" >> out/build.config
          fi

          echo "=== CLANG PATH IN BUILD CONFIG ==="
          grep -n "CLANG_PREBUILT_BIN" out/build.config

      # ============================================================
      # 9. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Clang toolchain
        working-directory: gta9
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          echo "=== TOOLCHAIN DIRECTORY ==="
          ls -la "${CLANG_BIN}"

          echo "=== REQUIRED TOOLS ==="

          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/clang++"
          test -x "${CLANG_BIN}/ld.lld"

          echo "clang:"
          "${CLANG_BIN}/clang" --version || true

          echo "clang++:"
          "${CLANG_BIN}/clang++" --version || true

          echo "ld.lld:"
          "${CLANG_BIN}/ld.lld" --version || true

          echo "=== HOST CLANG TEST ==="

          cat > /tmp/host-clang-test.c <<'EOF'
          #include <stdio.h>
          int main(void) {
              puts("HOST CLANG OK");
              return 0;
          }
          EOF

          "${CLANG_BIN}/clang" \
            --rtlib=compiler-rt \
            /tmp/host-clang-test.c \
            -o /tmp/host-clang-test

          /tmp/host-clang-test

      # ============================================================
      # 10. PREPARE INTERNAL BUILD TOOLS
      # ============================================================
      - name: Prepare internal build tools
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"
          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          mkdir -p "${BUILD_TOOLS_DIR}"

          echo "=== BUILD TOOLS BEFORE ==="
          ls -la "${BUILD_TOOLS_DIR}" || true

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # Android clang may be a wrapper that expects companion
          # clang.real / clang++.real relative to itself.
          #
          # Therefore copy the actual Clang directory contents rather
          # than creating only a single clang -> clang symlink.
          # --------------------------------------------------------

          for tool in \
            clang \
            clang++ \
            clang.real \
            clang++.real \
            clang-12 \
            clang++-12 \
            ld.lld
          do
            if [ -e "${CLANG_BIN}/${tool}" ]; then
              rm -f "${BUILD_TOOLS_DIR}/${tool}"

              cp -a \
                "${CLANG_BIN}/${tool}" \
                "${BUILD_TOOLS_DIR}/${tool}"

              echo "Installed ${tool}"
            else
              echo "Optional tool not present: ${tool}"
            fi
          done

          echo "=== BUILD TOOLS AFTER CLANG INSTALL ==="
          ls -la "${BUILD_TOOLS_DIR}"

          # --------------------------------------------------------
          # Normal host tools
          # --------------------------------------------------------

          for tool in \
            awk \
            basename \
            bash \
            cat \
            chmod \
            cp \
            cut \
            dirname \
            echo \
            env \
            find \
            grep \
            head \
            install \
            ln \
            mkdir \
            mktemp \
            mv \
            nproc \
            printf \
            pwd \
            readlink \
            rm \
            sed \
            sort \
            stat \
            tail \
            tar \
            test \
            tr \
            uname \
            xargs \
            zip
          do
            TOOL_PATH="$(command -v "${tool}")"

            if [ -n "${TOOL_PATH}" ]; then
              ln -sf "${TOOL_PATH}" "${BUILD_TOOLS_DIR}/${tool}"
            fi
          done

          # Host archive/linker tools
          ln -sf /usr/bin/ar "${BUILD_TOOLS_DIR}/ar" || true
          ln -sf /usr/bin/ranlib "${BUILD_TOOLS_DIR}/ranlib" || true
          ln -sf /usr/bin/strip "${BUILD_TOOLS_DIR}/strip" || true

          echo "=== INTERNAL TOOLS FINAL ==="
          ls -la "${BUILD_TOOLS_DIR}"

      # ============================================================
      # 11. VERIFY INTERNAL CLANG WRAPPER
      # ============================================================
      - name: Verify internal Clang
        working-directory: gta9
        run: |
          set -eux

          BUILD_TOOLS_DIR="${GITHUB_WORKSPACE}/gta9/build/build-tools/path/linux-x86"

          echo "========================================"
          echo "INTERNAL TOOLS"
          echo "========================================"

          test -x "${BUILD_TOOLS_DIR}/make"
          test -x "${BUILD_TOOLS_DIR}/clang"
          test -x "${BUILD_TOOLS_DIR}/clang++"
          test -x "${BUILD_TOOLS_DIR}/ld.lld"

          echo
          echo "=== CLANG WRAPPER ==="
          ls -la "${BUILD_TOOLS_DIR}/clang"

          echo
          echo "=== CLANG REAL ==="
          if [ -e "${BUILD_TOOLS_DIR}/clang.real" ]; then
            ls -la "${BUILD_TOOLS_DIR}/clang.real"
          else
            echo "clang.real is NOT present"
          fi

          echo
          echo "=== CLANG++ WRAPPER ==="
          ls -la "${BUILD_TOOLS_DIR}/clang++"

          echo
          echo "=== CLANG++ REAL ==="
          if [ -e "${BUILD_TOOLS_DIR}/clang++.real" ]; then
            ls -la "${BUILD_TOOLS_DIR}/clang++.real"
          else
            echo "clang++.real is NOT present"
          fi

          echo
          echo "=== INTERNAL CLANG VERSION ==="
          "${BUILD_TOOLS_DIR}/clang" --version

          echo
          echo "=== INTERNAL CLANG++ VERSION ==="
          "${BUILD_TOOLS_DIR}/clang++" --version

          echo
          echo "=== INTERNAL HOST CLANG TEST ==="

          cat > /tmp/internal-clang-test.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              puts("INTERNAL CLANG OK");
              return 0;
          }
          EOF

          "${BUILD_TOOLS_DIR}/clang" \
            --rtlib=compiler-rt \
            /tmp/internal-clang-test.c \
            -o /tmp/internal-clang-test

          /tmp/internal-clang-test

          echo
          echo "========================================"
          echo "INTERNAL CLANG TOOLCHAIN OK"
          echo "========================================"

      # ============================================================
      # 12. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: gta9
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -eux

          CLANG_BIN="${GITHUB_WORKSPACE}/gta9/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"

          export PATH="${CLANG_BIN}:${PATH}"

          export HOSTCC="${CLANG_BIN}/clang"
          export HOSTCXX="${CLANG_BIN}/clang++"
          export HOSTAR="/usr/bin/ar"
          export HOSTLD="${CLANG_BIN}/ld.lld"

          export BUILD_CONFIG="${GITHUB_WORKSPACE}/gta9/out/build.config"
          export OUT_DIR="${GITHUB_WORKSPACE}/gta9/out"
          export DIST_DIR="${GITHUB_WORKSPACE}/gta9/out/dist"

          mkdir -p "${OUT_DIR}"
          mkdir -p "${DIST_DIR}"

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT}"
          echo "HOSTCC=${HOSTCC}"
          echo "HOSTCXX=${HOSTCXX}"
          echo "HOSTAR=${HOSTAR}"
          echo "HOSTLD=${HOSTLD}"
          echo "BUILD_CONFIG=${BUILD_CONFIG}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DIST_DIR=${DIST_DIR}"

          echo
          echo "=== HOST CLANG ==="
          "${HOSTCC}" --version

          echo
          echo "=== HOST CLANG++ ==="
          "${HOSTCXX}" --version

          echo
          echo "=== HOST LLD ==="
          "${HOSTLD}" --version

          echo
          echo "=== START KERNEL BUILD ==="

          ./build/build.sh \
            HOSTCC="${HOSTCC}" \
            HOSTCXX="${HOSTCXX}" \
            HOSTAR="${HOSTAR}" \
            HOSTLD="${HOSTLD}" \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      # ============================================================
      # 13. INSPECT BUILD OUTPUT
      # ============================================================
      - name: Inspect build output
        if: always()
        working-directory: gta9
        run: |
          set +e

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find out \
            -maxdepth 7 \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
              -o -name 'vmlinux' \
            \) \
            -print 2>/dev/null \
            | sort

          echo
          echo "========================================"
          echo "DIST OUTPUT"
          echo "========================================"

          find out/dist \
            -maxdepth 5 \
            -type f \
            -print 2>/dev/null \
            | sort

      # ============================================================
      # 14. PREPARE RELEASE ARTIFACTS
      # ============================================================
      - name: Prepare release artifacts
        if: success()
        working-directory: gta9
        run: |
          set -eux

          mkdir -p release

          echo "=== FIND KERNEL OUTPUTS ==="

          IMAGE="$(find out -type f -name 'Image' | head -1)"
          IMAGE_GZ="$(find out -type f -name 'Image.gz' | head -1)"
          DTB="$(find out -type f -name 'mt6789.dtb' | head -1)"
          DTBO="$(find out -type f -name 'mt8781_gta9_eur_open_00.dtbo' | head -1)"

          echo "IMAGE=${IMAGE}"
          echo "IMAGE_GZ=${IMAGE_GZ}"
          echo "DTB=${DTB}"
          echo "DTBO=${DTBO}"

          if [ -n "${IMAGE}" ] && [ -f "${IMAGE}" ]; then
            cp "${IMAGE}" release/Image
          fi

          if [ -n "${IMAGE_GZ}" ] && [ -f "${IMAGE_GZ}" ]; then
            cp "${IMAGE_GZ}" release/Image.gz
          fi

          if [ -n "${DTB}" ] && [ -f "${DTB}" ]; then
            cp "${DTB}" release/mt6789.dtb
          fi

          if [ -n "${DTBO}" ] && [ -f "${DTBO}" ]; then
            cp "${DTBO}" release/mt8781_gta9_eur_open_00.dtbo
          fi

          echo
          echo "=== RELEASE ==="
          ls -lah release

          test -n "$(find release -type f -print -quit)"

      # ============================================================
      # 15. UPLOAD SUCCESS ARTIFACTS
      # ============================================================
      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: gta9/release/
          if-no-files-found: error

      # ============================================================
      # 16. UPLOAD DEBUG INFORMATION ON FAILURE
      # ============================================================
      - name: Prepare debug artifacts
        if: failure()
        working-directory: gta9
        run: |
          set +e

          mkdir -p debug

          cp -f out/build.config \
            debug/build.config 2>/dev/null || true

          find build/build-tools/path/linux-x86 \
            -maxdepth 1 \
            \( \
              -name 'clang' \
              -o -name 'clang.real' \
              -o -name 'clang++' \
              -o -name 'clang++.real' \
              -o -name 'clang-12' \
              -o -name 'ld.lld' \
            \) \
            -exec ls -la {} \; \
            > debug/internal-tools.txt 2>&1 || true

          {
            echo "=== CLANG ARCHIVE ==="
            ls -la prebuilts-master/clang/host/linux-x86/clang-r416183b/bin \
              2>/dev/null || true

            echo
            echo "=== INTERNAL TOOLS ==="
            ls -la build/build-tools/path/linux-x86 \
              2>/dev/null || true

            echo
            echo "=== BUILD CONFIG ==="
            grep -nE \
              'CLANG_PREBUILT_BIN|KERNEL_DIR|BUILD_CONFIG|OUT_DIR|DIST_DIR' \
              out/build.config \
              2>/dev/null || true
          } > debug/toolchain-layout.txt

          echo "=== DEBUG FILES ==="
          find debug -type f -maxdepth 2 -print

      # ============================================================
      # 17. UPLOAD DEBUG ARTIFACTS
      # ============================================================
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-build-debug
          path: gta9/debug/
          if-no-files-found: warn
