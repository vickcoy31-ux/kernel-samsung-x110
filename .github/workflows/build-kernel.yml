.github/workflows/build-kernel.yml
name: Build Kernel Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "Menyiapkan server build kernel..."
          uname -a
          free -h
          df -h

      - name: Test status
        run: echo "Server siap untuk merakit kernel Samsung Tab A9!"
