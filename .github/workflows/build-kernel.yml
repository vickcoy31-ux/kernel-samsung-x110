name: Build GTA9 X110

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3 \
            lz4 \
            cpio \
            rsync \
            kmod \
            wget \
            curl

      - name: Clone GTA9 Source
        run: |
          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9

          echo "=== GTA9 SOURCE ==="
          ls -la

          echo "=== REQUIRED DIRECTORIES ==="
          test -d kernel
          test -d kernel-5.10
          test -d setup

          echo "=== BUILD SCRIPT ==="
          test -f setup/build_kernel.sh
          chmod +x setup/build_kernel.sh

      - name: Inspect Build Infrastructure
        run: |
          cd gta9

          echo "=== kernel ==="
          ls -la kernel | head -50

          echo "=== kernel-5.10 ==="
          ls -la kernel-5.10 | head -50

          echo "=== build system ==="
          test -f kernel/build/build.sh

          echo "build/build.sh FOUND"

      - name: Build Kernel
        run: |
          cd gta9

          chmod +x setup/build_kernel.sh

          ./setup/build_kernel.sh --new

      - name: Show Output
        if: always()
        run: |
          echo "=== OUTPUT ==="

          find gta9/out \
            -maxdepth 3 \
            -type f \
            -exec ls -lh {} \; \
            2>/dev/null || true

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta9-x110-kernel
          path: |
            gta9/out/Image.gz
            gta9/out/dtb
            gta9/out/dtbo
            gta9/out/vendor_boot_modules/**
            gta9/out/vendor_dlkm_modules/**
