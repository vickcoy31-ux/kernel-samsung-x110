
      # ==========================================
      # 5. INTEGRATE ReSukiSU
      # ==========================================
      - name: Integrate ReSukiSU
        run: |
          set -eux

          cd kernel_source

          echo "=== Integrasi ReSukiSU ==="

          # Download official ReSukiSU setup script
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o /tmp/resukisu-setup.sh

          chmod +x /tmp/resukisu-setup.sh

          # Jalankan setup dari root source kernel
          bash /tmp/resukisu-setup.sh

          echo "=== Memeriksa hasil setup ==="

          echo "--- drivers/kernelsu ---"
          ls -ld drivers/kernelsu || true

          echo "--- Target symlink ---"
          readlink drivers/kernelsu || true

          echo "--- Isi folder drivers ---"
          ls -la drivers | head -50

          echo "--- Memeriksa Kconfig ---"

          if [ -f drivers/kernelsu/Kconfig ]; then
            echo "Kconfig ReSukiSU ditemukan."
          else
            echo "PERINGATAN: Kconfig tidak ditemukan melalui symlink."
          fi

          echo "--- Memeriksa Makefile ---"
          grep -n "kernelsu" drivers/Makefile || true

          echo "--- Memeriksa referensi Kconfig ---"
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig || true

          echo "=== Setup ReSukiSU selesai ==="
