
name: Build Samsung X110 ReSukiSU Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile ReSukiSU Kernel Image
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            curl \
            wget \
            python3 \
            rsync \
            cpio \
            lz4 \
            device-tree-compiler

      - name: Download Proton Clang
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Clone Samsung GTA9 Kernel
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/0xA11CE613/kernel_samsung_gta9.git \
            kernel_source

          cd kernel_source

          test -f Makefile
          test -d arch/arm64
          test -d drivers

      - name: Integrate ReSukiSU
        run: |
          set -eux

          cd kernel_source

          echo "=== Integrasi ReSukiSU ==="

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            -o /tmp/resukisu-setup.sh

          chmod +x /tmp/resukisu-setup.sh

          bash /tmp/resukisu-setup.sh

          echo "=== Memeriksa hasil setup ==="

          ls -ld drivers/kernelsu || true

          readlink drivers/kernelsu || true

          grep -n "kernelsu" drivers/Makefile || true

          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig || true

          echo "=== Setup selesai ==="

      - name: Find GTA9 Defconfig
        run: |
          set -eux

          cd kernel_source

          find arch/arm64/configs \
            -type f \
            \( -iname "*gta9*" -o -iname "*x110*" \) \
            -print

      - name: Configure Kernel
        run: |
          set -eux

          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          mkdir -p out

          CONFIG_PATH=$(
            find arch/arm64/configs \
              -type f \
              \( -iname "*gta9*" -o -iname "*x110*" \) \
              | head -n 1
          )

          if [ -z "$CONFIG_PATH" ]; then
            echo "ERROR: Defconfig GTA9/X110 tidak ditemukan."
            exit 1
          fi

          TARGET_CONFIG="${CONFIG_PATH#arch/arm64/configs/}"

          echo "Defconfig: $TARGET_CONFIG"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$TARGET_CONFIG"

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=' \
            out/.config || true

      - name: Build Kernel Image
        run: |
          set -eux

          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          ls -lh out/arch/arm64/boot/Image

          test -f out/arch/arm64/boot/Image

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-X110-ReSukiSU-Image
          path: kernel_source/out/arch/arm64/boot/Image
          if-no-files-found: error
