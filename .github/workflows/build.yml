
      # ==========================================
      # 5. INTEGRATE ReSukiSU
      # ==========================================
      - name: Integrate ReSukiSU
        run: |
          set -eux

          cd kernel_source

          echo "=== Integrasi ReSukiSU ==="

          # Bersihkan integrasi lama
          rm -rf KernelSU
          rm -rf ReSukiSU
          rm -f drivers/kernelsu

          # Clone repository ReSukiSU
          git clone --depth=1 \
            https://github.com/ReSukiSU/ReSukiSU.git \
            ReSukiSU

          echo "=== Memeriksa struktur ReSukiSU ==="

          find ReSukiSU -maxdepth 3 \
            -type f \
            \( -name Kconfig -o -name Makefile \) \
            -print

          # ReSukiSU kernel driver
          test -f ReSukiSU/kernel/Kconfig
          test -f ReSukiSU/kernel/Makefile

          # Buat symlink driver
          ln -s ../ReSukiSU/kernel drivers/kernelsu

          echo "=== Memeriksa symlink ==="

          ls -ld drivers/kernelsu

          readlink -f drivers/kernelsu

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "=== Menambahkan ke drivers/Makefile ==="

          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' \
              drivers/Makefile; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> drivers/Makefile
          fi

          echo "=== Menambahkan ke drivers/Kconfig ==="

          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig; then

            printf '\nsource "drivers/kernelsu/Kconfig"\n' \
              >> drivers/Kconfig
          fi

          echo "=== Verifikasi integrasi ==="

          grep -nF 'kernelsu' drivers/Makefile
          grep -nF 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo "=== ReSukiSU berhasil diintegrasikan ==="
